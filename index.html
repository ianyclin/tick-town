<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="滴答小鎮：給小學生看時鐘、撥時鐘、算時間的遊戲。沒有廣告、不用網路。">
<title>滴答小鎮</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="assets/icons/apple-touch-icon.png">
<meta name="theme-color" content="#bfe6ff">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Ccircle cx='32' cy='32' r='30' fill='%23fffaf0' stroke='%23e8c98f' stroke-width='4'/%3E%3Cpath d='M32 32V14' stroke='%23e8514f' stroke-width='5' stroke-linecap='round'/%3E%3Cpath d='M32 32l12 7' stroke='%233a7bd5' stroke-width='7' stroke-linecap='round'/%3E%3Ccircle cx='32' cy='32' r='3' fill='%235b4a3a'/%3E%3C/svg%3E">
<style>
@font-face{font-family:'Lilita';src:url(assets/fonts/lilita.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Chiron';src:url(assets/fonts/chiron-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Chiron';src:url(assets/fonts/chiron-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Chiron';src:url(assets/fonts/chiron-900.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:'ZenMaru';src:url(assets/fonts/zenmaru-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'ZenMaru';src:url(assets/fonts/zenmaru-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'ZenMaru';src:url(assets/fonts/zenmaru-900.woff2) format('woff2');font-weight:900;font-display:swap}
:root{
  --f-num:'Lilita','Chiron',"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-zh:'Chiron',"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --ink:#3b2f2f;--muted:#7a6a5a;--paper:#fff8ea;--panel:rgba(255,255,255,.82);--line:rgba(90,60,30,.18);
  --sun:#ffb340;--hour:#3a7bd5;--minute:#e8514f;--mint:#5fcf9a;--coral:#ff7a6b;
  --face:#fffaf0;--face-rim:#e8c98f;
  --sat:env(safe-area-inset-top,0px);--sab:env(safe-area-inset-bottom,0px);   /* 瀏海、動態島、底部橫條：body 是 fixed，padding 要加在每個畫面上（寫在 :root 沒有用） */
}
:lang(ko){--f-zh:'Chiron',"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif}   /* Chiron GoRound TC 有韓文字（切子集時一起切進來）；後面是缺字時的備用 */
:lang(ja){--f-zh:'ZenMaru',"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;--f-num:'Lilita','ZenMaru',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:var(--f-zh);color:var(--ink);background:#bfe6ff;overflow:hidden;position:fixed;inset:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
#town{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:calc(10px + var(--sat)) 16px calc(10px + var(--sab));z-index:1;gap:8px}
.top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.top>div{flex:none}
h1{margin:0;font-size:clamp(15px,5vw,26px);font-weight:900;letter-spacing:1px;color:#fff;white-space:nowrap;flex:1;min-width:0;overflow:hidden;text-shadow:0 2px 0 rgba(0,0,0,.35),0 0 8px rgba(0,0,0,.45)}
h1.two{white-space:normal;line-height:1.05;font-size:12px}
@media (max-width:400px){.top{gap:4px}.top>div{gap:4px!important}.top .chip{padding:0 8px;gap:4px}}
.icon-btn{min-width:44px;min-height:44px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:22px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.clock-wrap{width:min(78vw,44vh,360px);aspect-ratio:1;position:relative;margin-top:4px}
.clock-wrap>svg{width:100%;height:100%;overflow:visible;display:block;touch-action:none}
.hand{cursor:grab}.hand.on{cursor:grabbing}
.knob{fill:transparent;pointer-events:all}
.timecard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 18px;text-align:center;min-width:200px;max-width:100%;box-shadow:0 4px 0 rgba(0,0,0,.06);backdrop-filter:blur(6px)}
.digital{font-family:var(--f-num);font-size:40px;line-height:1;letter-spacing:1px}
.digital small{font-size:18px;color:var(--muted);margin-left:6px;font-family:var(--f-zh);font-weight:700}
.words{font-size:18px;font-weight:900;margin-top:2px;text-wrap:balance}
.scene{font-size:17px;font-weight:700;color:var(--muted);margin-top:2px;min-height:24px}
.scene .emo{font-size:22px;vertical-align:-2px;margin-right:4px}
.hintline{color:#fff;font-weight:900;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.4);text-align:center;text-wrap:balance;margin-top:-2px}
@media (max-height:620px){.hintline{display:none}}   /* 矮螢幕放不下這一行，模式鈕會被擠出去 */
.modes{margin-top:auto;width:100%;max-width:560px;display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:8px;padding-bottom:6px}
@media (max-width:420px){.modes{gap:5px}.mode{font-size:clamp(11px,3.2vw,13px)!important;padding:4px 2px;border-radius:16px}.mode .emo{font-size:26px!important}}
.now-btn{position:absolute;right:-6px;bottom:-6px;z-index:2;font-size:20px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:clamp(12px,3.6vw,14px);line-height:1.2;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08);text-wrap:balance;padding:6px 4px}
.mode .emo{font-size:30px;line-height:1}
.mode:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.mode.soon{opacity:.55}
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);display:grid;place-items:center;z-index:6;padding:calc(16px + var(--sat)) 16px calc(16px + var(--sab))}
.card{background:var(--paper);border-radius:24px;padding:18px;width:100%;max-width:420px;max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card>*{flex-shrink:0}
.hhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-18px;background:var(--paper);padding-top:2px;margin-top:-2px;z-index:1}
.hhead h3{margin:0;font-size:22px;font-weight:900}
.xbtn{min-width:44px;min-height:44px;border-radius:999px;font-size:22px;background:rgba(0,0,0,.06)}
.lab{font-size:14px;color:var(--muted);font-weight:700}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.langs button,.sw{min-height:44px;border-radius:14px;border:2px solid var(--line);font-weight:900;font-size:16px;background:#fff}
.langs button[aria-pressed=true],.sw[aria-pressed=true]{border-color:var(--hour);background:#e4efff;color:var(--hour)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.row .sw{flex:none;min-width:72px}.lab .sub{display:block;font-size:13px;font-weight:700;color:var(--muted);line-height:1.35;margin-top:2px}
.sw{min-width:72px;padding:0 14px}
.toast.mid{bottom:auto;top:calc(50% - 60px)}   /* 拔河時放中線上面，不蓋到下面那位的鐘 */
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(59,47,47,.92);color:#fff;padding:12px 18px;border-radius:999px;font-weight:900;font-size:16px;z-index:9;max-width:calc(100% - 32px);text-align:center;text-wrap:balance;pointer-events:none;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
.chip.who{color:var(--hour);max-width:7.5em}.chip.who .nm{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
@media (max-width:374px){.chip.who .nm{display:none}}
.who-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.who-list button{min-height:56px;border-radius:16px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:17px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:4px 8px;overflow:hidden}
.who-list button[aria-pressed=true]{border-color:var(--hour);background:#e4efff;color:var(--hour)}
.who-list button small{font-size:12px;font-weight:700;color:var(--muted)}
.who-list button span{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.name-in{min-height:52px;border-radius:14px;border:2px solid var(--line);padding:0 14px;font:inherit;font-size:20px;font-weight:700;background:#fff;width:100%;user-select:text;-webkit-user-select:text}
.name-in:focus{outline:none;border-color:var(--hour)}
.name-sug{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}.name-sug button{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:#fff;font-weight:700;font-size:15px}
.btn-col{display:flex;flex-direction:column;gap:10px}
.who-hint{font-size:14px;font-weight:700;color:var(--muted);text-align:center;min-height:0}
.who-hint:empty{display:none}
.bk-out{width:100%;min-height:90px;border-radius:12px;border:1px solid var(--line);padding:8px;font:12px/1.4 ui-monospace,monospace;word-break:break-all;user-select:text;-webkit-user-select:text;background:#fff}
.bk-msg{font-size:14px;font-weight:700;color:var(--hour);text-align:center}.bk-msg.bad{color:#c0392b}.bk-msg:empty{display:none}
.bk-confirm{display:flex;flex-direction:column;gap:10px;background:#fff3dc;border-radius:16px;padding:12px}
.card.about p.about-ded,.about-ded{margin:14px 0 2px;font-size:13px;line-height:1.6;color:var(--muted);text-align:center;text-wrap:balance}
.setbtn{min-height:44px;padding:0 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:900;font-size:15px;flex:none}
.chip{min-height:44px;border-radius:999px;background:var(--panel);border:1px solid var(--line);padding:0 11px;font-weight:900;font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.08);position:relative}
.chip.todo::after{content:'';position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.chip.ok{background:#dff7ea;border-color:var(--mint)}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;font-size:16px}
.q .em{font-size:26px}.q .bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden}.q .bar i{display:block;height:100%;background:var(--mint);border-radius:5px}
.q.done{background:#dff7ea;border-color:var(--mint)}
.q small{color:var(--muted);font-family:var(--f-num);font-size:14px}
.badges{display:flex;justify-content:space-between;font-weight:900;font-size:15px;color:var(--muted)}
.gate-q{font-family:var(--f-num);font-size:34px;text-align:center;line-height:1.2}
.gate-a{display:flex;justify-content:center;gap:8px}.gate-a i{width:40px;height:50px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-family:var(--f-num);font-size:28px;font-style:normal}
.danger{min-height:44px;border-radius:999px;border:2px solid var(--coral);color:#c0392b;font-weight:900;font-size:15px;padding:0 16px;background:#fff}
.lab.parent{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px;margin-top:4px}
.mcard{aspect-ratio:1;perspective:600px;min-height:44px}
.mcard .inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .inner,.mcard.done .inner{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.mcard .bk{background:linear-gradient(160deg,#ffd27a,#ffb340);font-size:34px}
.mcard .fr{background:var(--panel);transform:rotateY(180deg);overflow:hidden;padding:6px}
.mcard .fr svg{width:100%;height:100%;overflow:visible}
.mcard .fr .dg{font-family:var(--f-num);font-size:clamp(20px,7vw,32px);color:var(--hour)}
.mcard .fr .wd{font-weight:900;font-size:clamp(13px,4vw,17px);text-align:center;line-height:1.3;text-wrap:balance}
.mcard.done .fr{background:#dff7ea;border-color:var(--mint)}
.mcard.no .inner{animation:tilt .5s ease}
@media (prefers-reduced-motion:reduce){.mcard .inner{transition:none}}
#s-versus{padding:var(--sat) 0 var(--sab);touch-action:none;gap:0}
.half{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 12px;min-height:0;position:relative}
.half.flip{transform:rotate(180deg);background:rgba(255,255,255,.12)}
.half .clock-wrap{width:min(62vw,32vh,280px);margin:0}
.vtask{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.vtask b{font-family:var(--f-num);font-size:24px;color:var(--hour);font-weight:400}
.vtask .emo{font-size:22px}
.vmid{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 8px;font-family:var(--f-num);font-size:22px}
.vmid .dots{display:flex;gap:4px}.vmid .dots i{width:12px;height:12px;border-radius:50%;background:rgba(0,0,0,.12)}.vmid .dots i.on{background:var(--sun);box-shadow:0 0 6px var(--sun)}
.vmid .link-btn{min-height:44px;font-size:14px;padding:0 10px;margin-right:auto;white-space:nowrap}
.robot{font-size:64px;line-height:1;transition:transform .2s}.robot.think{animation:robotThink 1s ease-in-out infinite}
@keyframes robotThink{50%{transform:rotate(6deg) translateY(-3px)}}
.vbar{width:160px;height:10px;border-radius:5px;background:rgba(0,0,0,.1);overflow:hidden}.vbar i{display:block;height:100%;background:var(--mint);width:0}
.vgot{animation:jump .6s ease}
.opt-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-row button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:16px}
.opt-row button[aria-pressed=true]{border-color:var(--hour);background:#e4efff;color:var(--hour)}
@media (max-height:640px){.half .clock-wrap{width:min(56vw,29vh,220px)}.robot{font-size:44px}.vtask{font-size:14px}.vtask b{font-size:20px}}
.help h4{margin:10px 0 4px;font-size:17px;color:var(--hour)}
.help ul{margin:0;padding-left:18px;font-size:15px;line-height:1.55}
.help li{margin-bottom:4px;text-wrap:pretty}
.help li b{color:#c0392b}
.about p{text-align:left;font-size:15px;line-height:1.55}
.about h4{margin:8px 0 2px;font-size:16px}
.linkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkrow .link-btn{text-align:center}
:lang(ja) .toast,:lang(ja) .mode,:lang(ja) .bubble,:lang(ja) .say,:lang(ja) .btn,:lang(ja) .langs button,:lang(ja) .link-btn,:lang(ja) .danger,:lang(ko) body{word-break:keep-all;overflow-wrap:anywhere}   /* 日文在空格處斷行，不在詞中間 */
#s-read .clock-wrap.small{width:min(58vw,30vh,300px)}
@media (max-height:640px){#s-read .clock-wrap.small{width:min(50vw,22vh,220px)}.pad .keys{gap:6px}.pad .key{min-height:44px;font-size:22px}.padin{font-size:28px;padding:6px 18px}}
.pad .key,.pad .padin{background:var(--paper)}
.ghost{stroke:#ff7a6b;stroke-width:5;stroke-dasharray:7 5;stroke-linecap:round;fill:none;opacity:.95;paint-order:stroke}
.ghost.under{stroke:#fff;stroke-width:9;stroke-dasharray:none;opacity:.9}
.legend span{background:rgba(40,30,20,.35);border-radius:999px;padding:3px 9px}
.card.about p{text-align:left}
.gate-q{white-space:nowrap;font-size:clamp(22px,8vw,34px)}
.danger{font-size:14px}
.pet-stage{width:min(60vw,36vh,300px);aspect-ratio:1;display:grid;place-items:center;cursor:pointer}
.pet-stage svg{width:100%;height:100%;overflow:visible;animation:petIdle 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes petIdle{50%{transform:translateY(-4px)}}
.pet-stage.pop svg{animation:jump .6s ease}
.pet-name{font-size:22px;font-weight:900;text-align:center;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.35),0 0 6px rgba(0,0,0,.4)}
.pet-name small{display:block;font-size:14px;font-weight:700}
.pet-bar{width:min(70vw,300px);height:12px;border-radius:6px;background:rgba(255,255,255,.5);overflow:hidden;border:1px solid var(--line)}
.pet-bar i{display:block;height:100%;background:var(--sun);border-radius:6px;transition:width .3s}
.pet-cards{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px}
.pet-card{background:var(--panel);border:2px solid var(--line);border-radius:20px;padding:10px 6px;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:900;font-size:15px;box-shadow:0 4px 0 rgba(0,0,0,.08)}
.pet-card .emo{font-size:40px;line-height:1}
.pet-card small{font-size:12px;color:var(--muted);font-weight:700;text-align:center;text-wrap:balance}
.gear{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;width:100%;max-width:420px;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px}
.gear-t{flex-basis:100%;text-align:center;font-size:13px;color:var(--muted);font-weight:700}
.gear button{width:84px;min-height:70px;border-radius:14px;border:1px solid var(--line);background:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;font-weight:700;padding:6px 4px;text-align:center;line-height:1.2}
.gear button .emo{font-size:26px;line-height:1}
.gear button[aria-pressed=true]{border-color:var(--hour);background:#e4efff}
.gear button[aria-disabled=true]{opacity:.5}
.gear button small{color:var(--muted);font-size:11px}
.pet-scroll{width:100%;flex:1;min-height:0;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:8px;padding-bottom:8px}
.legal{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.link-btn{min-height:44px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.lights{background:var(--panel);border:1px solid var(--line);border-radius:999px;min-height:44px;display:flex;align-items:center;padding:0 14px;font-family:var(--f-num);font-size:20px;gap:6px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 14px;display:flex;align-items:center;gap:12px;width:100%;max-width:520px;box-shadow:0 4px 0 rgba(0,0,0,.06);backdrop-filter:blur(6px)}
.task .emo{font-size:44px;line-height:1;flex:none;display:inline-block}
.task .emo.jump{animation:jump .7s ease}
.task .emo.tilt{animation:tilt .8s ease}
@keyframes jump{30%{transform:translateY(-18px) rotate(-8deg)}60%{transform:translateY(0) scale(1.1,.9)}80%{transform:translateY(-6px)}}
@keyframes tilt{25%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}
.task .say{font-size:17px;font-weight:900;line-height:1.35;text-wrap:pretty;flex:1}
.task .target{font-family:var(--f-num);font-size:34px;line-height:1;color:var(--hour);flex:none}

/* ========== 軟陶玩具風（整套介面的皮）：奶油色的軟陶塊、圓滾滾、浮起來有光影；按鈕像糖果，按下去會扁 ========== */
:root{
  --ink:#5b4034;--muted:#8f7566;--paper:#fffaf2;--panel:#fffaf2;--line:rgba(140,95,70,.22);
  --sun:#ffc64f;--sun-d:#e39a2c;--hour:#3f86dc;--minute:#ee5a58;--mint:#66cf9c;--coral:#ff8a7a;
  --face:#fffaf0;
  --clay:0 7px 16px rgba(110,70,60,.24),inset 0 -6px 9px rgba(200,145,105,.22),inset 0 3px 4px #fff;
  --clay-s:0 4px 9px rgba(110,70,60,.22),inset 0 -4px 6px rgba(200,145,105,.2),inset 0 2px 3px #fff;
  --clay-in:inset 0 3px 6px rgba(140,95,70,.28),inset 0 -2px 2px rgba(255,255,255,.9);
  --clay-c:inset 0 -5px 7px rgba(0,0,0,.1),inset 0 3px 4px rgba(255,255,255,.7);   /* 有顏色的軟陶：暗亮都用半透明，什麼顏色都能用 */
  --pan:linear-gradient(180deg,#fffdf9,#fff2e2);
}
body{background:#bfe6ff}
h1{color:#fff;text-shadow:0 2px 0 #e58aa2,0 4px 0 rgba(150,70,95,.35),0 6px 10px rgba(120,60,80,.35);padding:2px 0 8px 2px}
.hintline,.pet-name{color:#fff;text-shadow:0 1.5px 0 #c9788f,0 3px 6px rgba(120,60,80,.45)}
.legend{color:var(--ink);text-shadow:none}.legend span{background:var(--pan);box-shadow:var(--clay-s);padding:5px 11px}.legend i{border:0;box-shadow:inset 0 -2px 2px rgba(0,0,0,.12),inset 0 1px 1px rgba(255,255,255,.7)}
/* 奶油色軟陶塊 */
.timecard,.task,.info,.gear,.card,.bubble,.padin,.vtask,.lights,.tut-note,.pick,.pet-card,.q,.bk-confirm{background:var(--pan);border:0;box-shadow:var(--clay);backdrop-filter:none}
.chip,.icon-btn,.link-btn,.lights,.vtask,.tut-note,.setbtn,.name-sug button{background:var(--pan);border:0;box-shadow:var(--clay-s)}
.chip:active,.icon-btn:active,.link-btn:active,.setbtn:active,.mode:active,.opt:active,.key:active,.pick:active,.pet-card:active,.gear button:active,.langs button:active,.sw:active,.opt-row button:active,.who-list button:active{transform:translateY(2px) scale(.98)}
.timecard{border-radius:26px}.task{border-radius:26px}.card{border-radius:30px;box-shadow:0 18px 40px rgba(80,45,60,.35),inset 0 -8px 12px rgba(200,145,105,.2),inset 0 4px 5px #fff}
.hhead{background:#fffbf4}
.overlay{background:rgba(88,56,74,.5)}
.vmid{background:var(--pan);border:0;box-shadow:0 0 12px rgba(110,70,60,.3),inset 0 3px 3px #fff,inset 0 -3px 5px rgba(200,145,105,.22)}
.digital{color:var(--ink)}
.chip.ok,.q.done,.mcard.done .fr{background:linear-gradient(180deg,#e6fbef,#c9f1da)}
.chip.todo::after{width:13px;height:13px;top:-3px;right:-3px;background:radial-gradient(circle at 35% 30%,#ffb1a6,#ff7a6b 60%);box-shadow:0 0 0 2.5px #fffaf2,0 2px 3px rgba(0,0,0,.25)}
/* 糖果按鈕 */
.btn{background:linear-gradient(180deg,#ffdc7a,#ffbd45);color:var(--ink);box-shadow:0 5px 0 #df962b,0 10px 14px rgba(170,105,30,.3),inset 0 3px 3px rgba(255,255,255,.75),inset 0 -4px 6px rgba(215,130,25,.3)}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 #df962b,0 3px 6px rgba(170,105,30,.3),inset 0 3px 3px rgba(255,255,255,.75),inset 0 -4px 6px rgba(215,130,25,.3)}
.btn.alt{background:var(--pan);box-shadow:0 5px 0 #e3ccb4,0 10px 14px rgba(110,70,60,.2),inset 0 3px 3px #fff,inset 0 -4px 6px rgba(200,145,105,.2)}
.btn.alt:active{box-shadow:0 1px 0 #e3ccb4,0 3px 6px rgba(110,70,60,.2),inset 0 3px 3px #fff,inset 0 -4px 6px rgba(200,145,105,.2)}
.btn:disabled{filter:grayscale(.5);opacity:.6}
.key{background:var(--pan);border:0;box-shadow:0 3px 0 #e3ccb4,0 6px 8px rgba(110,70,60,.18),inset 0 2px 2px #fff,inset 0 -3px 5px rgba(200,145,105,.2);color:var(--ink)}
.key.ok{background:linear-gradient(180deg,#ffdc7a,#ffbd45);box-shadow:0 3px 0 #df962b,0 6px 8px rgba(170,105,30,.25),inset 0 2px 2px rgba(255,255,255,.75),inset 0 -3px 5px rgba(215,130,25,.3)}
.pad .key,.pad .padin{background:var(--pan)}
.padin{box-shadow:var(--clay-in);background:#fff6e9}
/* 主選單的五顆大鈕：每顆一個顏色 */
.mode{border:0;border-radius:24px;color:var(--ink);background:linear-gradient(180deg,var(--m1),var(--m2));box-shadow:0 5px 0 var(--m3),0 10px 14px rgba(110,70,60,.25),var(--clay-c);--m1:#fffdf9;--m2:#fff2e2;--m3:#e3ccb4}
.mode:active{transform:translateY(4px);box-shadow:0 1px 0 var(--m3),0 3px 6px rgba(110,70,60,.25),var(--clay-c)}
.mode[data-mode=day]{--m1:#ffe3c4;--m2:#ffc999;--m3:#e9a06a}
.mode[data-mode=read]{--m1:#d6eeff;--m2:#aedbff;--m3:#7fb5e6}
.mode[data-mode=match]{--m1:#fff3b0;--m2:#ffe07a;--m3:#e5b740}
.mode[data-mode=shop]{--m1:#e6dcff;--m2:#cdbdf5;--m3:#a48fdc}
.mode[data-mode=versus]{--m1:#d3f6de;--m2:#a8e8bf;--m3:#72c693}
.mode .emo{font-size:34px;background:rgba(255,255,255,.6);border-radius:50%;padding:5px;box-shadow:inset 0 2px 3px rgba(120,80,60,.14),0 1px 0 rgba(255,255,255,.7)}
.m-lock{background:linear-gradient(180deg,#8fe3b6,#66cf9c);color:#1f4a35;box-shadow:0 2px 0 #46a878,inset 0 1px 1px rgba(255,255,255,.7);top:-10px}
.m-lock.locked{background:var(--pan);box-shadow:0 2px 0 #e3ccb4,inset 0 1px 1px #fff;padding:2px 5px}
/* 可以選的東西：沒選是凹下去的淺色，選了是亮亮的藍色軟陶 */
.langs button,.sw,.opt-row button,.who-list button,.gear button{border:0;background:var(--pan);box-shadow:var(--clay-s);color:var(--ink)}
.langs button[aria-pressed=true],.sw[aria-pressed=true],.opt-row button[aria-pressed=true],.who-list button[aria-pressed=true],.gear button[aria-pressed=true]{background:linear-gradient(180deg,#d9ecff,#b3d8ff);color:#245f9e;box-shadow:0 3px 0 #7fb5e6,0 6px 9px rgba(60,110,170,.25),var(--clay-c)}
.sw[aria-pressed=true]{background:linear-gradient(180deg,#b9f0d2,#8fe3b6);color:#1f5a3d;box-shadow:0 3px 0 #58bd8b,0 6px 9px rgba(50,130,90,.25),var(--clay-c)}
.pick{border:0}.pick[aria-pressed=true]{background:linear-gradient(180deg,#d9ecff,#b3d8ff);box-shadow:0 4px 0 #7fb5e6,0 9px 12px rgba(60,110,170,.25),var(--clay-c)}
.name-in,.bk-out{border:0;background:#fff6e9;box-shadow:var(--clay-in)}.name-in:focus{box-shadow:var(--clay-in),0 0 0 3px #b3d8ff}
.xbtn{background:var(--pan);box-shadow:var(--clay-s);font-size:18px;color:var(--muted)}
.danger{border:0;background:linear-gradient(180deg,#ffe1dc,#ffc7be);color:#b33a2c;box-shadow:0 3px 0 #ea9a8e,var(--clay-c)}
.gate-a i{border:0;background:#fff6e9;box-shadow:var(--clay-in)}
.q .bar,.pet-bar,.vbar{background:#f3e3d2;box-shadow:var(--clay-in);border:0}.q .bar i,.vbar i{background:linear-gradient(180deg,#8fe3b6,#58c78f);box-shadow:inset 0 2px 2px rgba(255,255,255,.6)}
.pet-bar{height:16px;border-radius:8px}.pet-bar i{background:linear-gradient(180deg,#ffdc7a,#ffb53d);box-shadow:inset 0 2px 2px rgba(255,255,255,.6);border-radius:8px}
/* 提示泡泡、答案卡 */
.bubble{border:0;box-shadow:0 0 0 4px #ffd36b,var(--clay)}.bubble.good{box-shadow:0 0 0 4px #8fe3b6,var(--clay)}
.bubble.over{box-shadow:0 0 0 4px #ffd36b,0 14px 34px rgba(80,45,60,.35),inset 0 -6px 9px rgba(200,145,105,.22),inset 0 3px 4px #fff}
.opt{border:0;background:var(--pan);box-shadow:0 4px 0 #e3ccb4,0 9px 12px rgba(110,70,60,.2),inset 0 3px 3px #fff,inset 0 -4px 6px rgba(200,145,105,.2);color:var(--ink)}
.opt.no{opacity:.45;box-shadow:var(--clay-in);border:0}
.opt.yes{background:linear-gradient(180deg,#e6fbef,#bff0d5);box-shadow:0 4px 0 #58bd8b,0 0 0 4px rgba(102,207,156,.45),var(--clay-c)}
.tag{background:linear-gradient(180deg,#fffbe6,#ffefb8);border:0;box-shadow:0 4px 0 #dcb04e,0 9px 12px rgba(110,70,60,.22),inset 0 3px 3px #fff,inset 0 -4px 6px rgba(215,160,45,.22)}
.tag::before{background:#bfe6ff;border:0;box-shadow:var(--clay-in)}
.tag.fixed{background:linear-gradient(180deg,#e6fbef,#bff0d5);box-shadow:0 4px 0 #58bd8b,0 9px 12px rgba(50,130,90,.22),var(--clay-c)}
/* 配對的卡片 */
.mcard .f{border:0;border-radius:20px;box-shadow:0 4px 0 #e3ccb4,0 8px 10px rgba(110,70,60,.2),inset 0 3px 3px #fff,inset 0 -4px 6px rgba(200,145,105,.2)}
.mcard .bk{background:linear-gradient(180deg,#ffd9e2,#ffb7c9);box-shadow:0 4px 0 #e58aa2,0 8px 10px rgba(150,70,95,.22),var(--clay-c)}
.mcard .fr{background:var(--pan)}
.mcard.done .fr{box-shadow:0 4px 0 #58bd8b,0 8px 10px rgba(50,130,90,.2),var(--clay-c)}
/* 星圖 */
.cell{stroke:#fffaf2;stroke-width:.9}.cell.new{fill:#f6ead9}.cell.learn{fill:#ffd27f}.cell.weak{fill:#ff9d8f}.cell.star{fill:#ffd84a}
.sec-on .cell.on{stroke:#fffaf2}.mlab{fill:var(--ink);stroke:#fffaf2;stroke-width:2.5px}
.hrow span{background:#f6ead9;box-shadow:inset 0 -2px 2px rgba(0,0,0,.08),inset 0 1px 1px #fff}
.toast{background:linear-gradient(180deg,#75564a,#5b4034);box-shadow:0 8px 18px rgba(60,30,40,.4),inset 0 2px 2px rgba(255,255,255,.2)}
.half.flip{background:rgba(255,255,255,.14)}
.ring-n{fill:#c7574d}
#splash{background:linear-gradient(#bfe6ff,#ffeef2 70%,#fff3df)}
#splash .sp-title{text-shadow:0 3px 0 #e58aa2,0 6px 0 rgba(150,70,95,.3),0 8px 16px rgba(120,60,80,.35)}
#splash img{box-shadow:0 14px 30px rgba(110,70,60,.3)}
/* 家長報告、介紹另一個遊戲的卡 */
.rep-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.rep-sum div{background:#fff6e9;box-shadow:var(--clay-in);border-radius:16px;padding:8px 4px;text-align:center;display:flex;flex-direction:column;gap:2px}
.rep-sum b{font-family:var(--f-num);font-size:26px;color:var(--hour);font-weight:400;line-height:1.1}.rep-sum span{font-size:12px;font-weight:700;color:var(--muted);line-height:1.2}
.card.report p{text-align:left;font-size:15px;line-height:1.55}
.card.report h4{margin:6px 0 0;font-size:17px;color:var(--hour)}
.card.report .lab{font-size:13px}
.rep-err{background:var(--pan);box-shadow:var(--clay-s);border-radius:18px;padding:10px 12px;display:flex;flex-direction:column;gap:6px}
.rep-head{display:flex;align-items:center;gap:10px}.rep-head .pc{width:66px;aspect-ratio:1;flex:none;pointer-events:none}.rep-head .pc svg{width:100%;height:100%;display:block;overflow:visible}
.rep-head b{font-size:16px;line-height:1.3;display:block}.rep-head small{font-size:12px;color:#c0392b;font-weight:700}
.rep-err p i{font-style:normal;font-weight:900;color:#245f9e;margin-right:6px;font-size:12px;background:#dcecff;border-radius:999px;padding:2px 8px;white-space:nowrap}
.rep-bar{display:flex;height:14px;border-radius:7px;overflow:hidden;background:#f3e3d2;box-shadow:var(--clay-in)}.rep-bar i{display:block}.rep-bar .s{background:#ffd84a}.rep-bar .l{background:#ffc070}.rep-bar .w{background:#ff9d8f}
.promo{display:flex;align-items:center;gap:10px;background:var(--pan);box-shadow:var(--clay-s);border-radius:18px;padding:10px 12px;text-align:left}
.promo img{width:56px;height:56px;border-radius:13px;flex:none;box-shadow:0 3px 6px rgba(110,70,60,.25)}
.promo div{flex:1;min-width:0;display:flex;flex-direction:column;line-height:1.3}.promo small{font-size:12px;color:var(--muted);font-weight:700}.promo b{font-size:17px}.promo span{font-size:13px;color:var(--muted)}
/* 圖示與插畫 */
.ic{width:1.15em;height:1.15em;display:inline-block;vertical-align:-0.2em;flex:none;object-fit:contain}
img.av{height:1.25em;width:auto;display:block;flex:none;filter:drop-shadow(0 2px 2px rgba(90,50,40,.25))}
.emo .ic,.big .ic{display:block}.scene .emo .ic{display:inline-block}.big .ic{width:1.3em;height:1.3em;margin:0 auto}
.big img.av{height:1.5em;margin:0 auto}
.task .emo{font-size:52px}
@media (max-height:640px){.task .emo{font-size:40px}.mode .emo{font-size:26px;padding:3px}}
@media (max-width:420px){.mode{border-radius:20px}.mode .emo{font-size:28px!important;padding:4px}}
</style>
</head>

    'help.title': 'How to play',
    'help.clockT': 'The clock', 'help.clock': '<li>The short hand is <b>Tortoise</b>. It moves slowly and tells the hour.</li><li>The long hand is <b>Rabbit</b>. It moves fast and tells the minutes.</li><li>Drag Rabbit. Each number is 5 minutes. Tortoise follows slowly.</li><li>The small numbers around the outside (05, 10, 15…) are the minutes. Rabbit on 4? The ring says 20, so it\'s 20 minutes. You can turn the ring off in Settings.</li><li>On the menu you can spin the clock any way you like. Watch the sun, the lights and the animals change!</li><li>Let go right on the hour and the tower bell rings: 3 rings at 3 o\'clock, 12 rings at 12.</li>',
    'help.dayT': "Town's Day", 'help.day': '<li>The animals have 7 things to do each day. Set the clock to the right time.</li><li>Set it right and the animal goes out. Its house lights up.</li><li>Got it wrong? No worries. Dotted hands will show the right spot. Try again!</li><li>Times that trick you come up more often, so you get more practice.</li><li>Light all 7 and the town sets off fireworks!</li>',
    'help.readT': 'What time?', 'help.read': '<li>Look at the clock and pick the right time from three cards.</li><li>Picked wrong? Just pick again.</li><li>Times you know well switch to typing: type the hour, then the minutes, then tap "Done".</li>',
    'help.matchT': 'Match', 'help.match': '<li>Flip two cards and find the same time.</li><li>Clocks, digital times and words can all show up.</li>',
    'help.vsT': 'Two players', 'help.vs': '<li>Two clocks, one on each side. Set yours right first to get a point. 5 points wins.</li><li>Play against the robot, or a friend (the top clock is upside down for them).</li>',
    'help.mapT': 'Star map', 'help.map': '<li>Every time has a star. Read it or set it right a few times and it lights up.</li><li>The inner ring is 1 o\'clock, the outer ring is 12. Each slice is 5 minutes.</li><li>Tap a slice to see which times are lit.</li>',
    'help.questT': 'Missions', 'help.quest': '<li>3 missions a day. Finish them all for a badge.</li><li>Didn\'t finish? That\'s fine too.</li>',
    'about.title': 'About',
    'about.whyT': 'What this game practices', 'about.why': 'Reading a clock, setting a clock, and working out how much time has passed. Kids make a few typical mistakes (reading the next hour when the hour hand is almost there, taking the number the minute hand points to as the minutes, swapping the hands, the half-past position). The game tracks which kind of mistake, not just which question, shows more of the times that trigger it, and gives hints aimed at that mistake. The star map tells you which one your child mixes up most.',
    'about.levelT': 'Three levels', 'about.level': 'In Settings, "Practice": o\'clock and half past (about 1st grade); hours and minutes (about 2nd grade, 5-minute steps); how long (about 3rd grade, 1-minute steps, plus "left at …, walked for … minutes, arrived at?"). The default is level 2.',

    'help.clockT': '시계', 'help.clock': '<li>짧은 바늘은 <b>거북이</b>. 천천히 움직이고 "몇 시"를 알려 줘.</li><li>긴 바늘은 <b>토끼</b>. 빨리 움직이고 "몇 분"을 알려 줘.</li><li>토끼를 끌어 봐. 숫자 한 칸이 5분이야. 거북이는 천천히 따라와.</li><li>바깥쪽 작은 숫자(05, 10, 15…)가 "몇 분"이야. 토끼가 4를 가리키면 바깥은 20, 그러니까 20분이야. 설정에서 끌 수 있어.</li><li>메뉴의 시계는 마음대로 돌려 봐. 해, 불빛, 동물들이 바뀌어!</li><li>손을 뗐을 때 딱 정각이면 시계탑이 울려: 3시는 3번, 12시는 12번.</li>',

let LANG = 'zh-Hant', mode = 'menu';
const langAuto = () => { for (const l of (navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ''])) { const x = String(l).toLowerCase(); if (x.startsWith('zh')) return 'zh-Hant'; if (x.startsWith('ja')) return 'ja'; if (x.startsWith('ko')) return 'ko'; if (x.startsWith('es')) return 'es'; if (x.startsWith('en')) return 'en'; } return 'en'; };
function tx(key, p) {
  let s = STR[LANG][key]; if (s === undefined) s = STR['zh-Hant'][key]; if (s === undefined) return key;
  if (typeof s === 'function') s = s(p || {});
  return p ? String(s).replace(/\{(\w+)\}/g, (_, k) => k in p ? p[k] : `{${k}}`) : s;
}
function applyStr() {
  document.documentElement.lang = LANG;
  $$('[data-t]').forEach(el => el.textContent = tx(el.dataset.t));
  $$('[data-th]').forEach(el => el.innerHTML = tx(el.dataset.th));
  $$('[data-ta]').forEach(el => el.setAttribute('aria-label', tx(el.dataset.ta)));
  $$('[data-tp]').forEach(el => el.setAttribute('placeholder', tx(el.dataset.tp)));
  fitTitle();
}
// 標題一行放不下就縮字（英文 "Tick-Tock Town" 在窄手機上會被右邊的鈕切掉）；縮到 11px 還放不下（320px 寬的英、日文）才折成兩行
function fitTitle() {
  const h = $('h1'); if (!h) return; h.style.visibility = ''; h.classList.remove('two'); h.style.fontSize = ''; h.textContent = tx('title'); if (!h.clientWidth) return;
  let px = parseFloat(getComputedStyle(h).fontSize); while (h.scrollWidth > h.clientWidth && px > 11) { px = Math.max(11, px - 1); h.style.fontSize = px + 'px'; }
  if (h.scrollWidth > h.clientWidth) { h.style.fontSize = ''; h.classList.add('two'); h.innerHTML = tx('title2').split('|').join('<br>'); }
  h.style.visibility = h.scrollWidth > h.clientWidth + 1 ? 'hidden' : '';   // 兩行也放不下（窄手機又有名字鈕）：標題藏起來，名字鈕和其他鈕優先
}
addEventListener('resize', fitTitle); if (document.fonts && document.fonts.ready) document.fonts.ready.then(fitTitle);
function setLang() { LANG = STR[DB.set.lang] ? DB.set.lang : langAuto(); applyStr(); if (typeof renderLocks === 'function' && $('#go-match')) try { renderLocks(); } catch (e) {} }

const ART = (() => {
  // 軟陶濾鏡：c 給 120 單位的大圖、cs 給 48 單位的小圖示。做法：邊緣一圈暗（右下）＋一圈亮（左上）＋細顆粒
  const clay = (id, b, dx, dy, sh, hl, gr) => `<filter id="${id}" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
<feGaussianBlur in="SourceAlpha" stdDeviation="${b}" result="b"/>
<feOffset in="b" dx="${-dx}" dy="${-dy}" result="b1"/><feComposite in="SourceAlpha" in2="b1" operator="out" result="s1"/>
<feFlood flood-color="#4a1f10" flood-opacity="${sh}"/><feComposite in2="s1" operator="in" result="sh"/>
<feOffset in="b" dx="${dx}" dy="${dy}" result="b2"/><feComposite in="SourceAlpha" in2="b2" operator="out" result="s2"/>
<feFlood flood-color="#fff" flood-opacity="${hl}"/><feComposite in2="s2" operator="in" result="hl"/>

// 這個時刻「可能誘發」哪些錯法：答對只能證明這幾種沒犯，其他類型的權重不動
function inducible(h, m) { const t = ['handSwap', 'minNear', 'hourOff', 'other']; if (m >= 35) t.push('hourLate'); if (m === 30) t.push('halfHour'); if (m >= 5 && m % 5 === 0 && m % 30 !== 0) t.push('minIndex'); if (h % 12 === 0 || h % 12 === 1) t.push('read12'); if (m % 5 !== 0) t.push('minOne'); return t; }
const dayKey = d => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
function record(k, ok, ms, errType, induce) {
  const f = DB.facts[k] || (DB.facts[k] = { n: 0, w: 0, err: 0, t: 0 });
  f.n++; f.err = f.err * 0.7 + (ok ? 0 : 0.3); if (!ok) f.w++; else if (ms > 0) f.t = f.t ? f.t * 0.6 + ms * 0.4 : ms;
  if (ok) { for (const e of induce || []) DB.errs[e] = num(DB.errs[e]) * 0.85; }   // 答對：這題可能誘發的錯法權重衰減
  else if (errType) DB.errs[errType] = num(DB.errs[errType]) * 0.85 + 0.15;        // 答錯：犯的那一種加權
  { const d = dayKey(new Date()), L = DB.log || (DB.log = {}), e = L[d] || (L[d] = { n: 0, ok: 0, e: {} }); e.n++; if (ok) e.ok++; else if (errType && ERRS.includes(errType)) e.e[errType] = num(e.e[errType]) + 1; const ks = Object.keys(L).sort(); while (ks.length > 28) delete L[ks.shift()]; }   // 每天的紀錄（家長報告用），只留 28 天
  save();
}
// 撥鐘答錯是哪一種錯（target T、answer A，都是一天裡的分鐘）
function classifySet(T, A) {
  const th = Math.floor(T / 60) % 12, tm = T % 60, ah = Math.floor(A / 60) % 12, am = A % 60;
  const nh = h => (h + 1) % 12;
  if (am === tm && ah === nh(th)) return tm === 30 ? 'halfHour' : tm >= 35 ? 'hourLate' : 'hourOff';
  if (tm >= 10 && am === 5 * Math.floor(tm / 10) && ah === th) return 'minIndex';   // 7:20 把兔子放在 2
  if (am === (th === 0 ? 0 : th * 5) && ah % 12 === (tm / 5) % 12 && tm % 5 === 0) return 'handSwap';
  if (ah === th && Math.abs(am - tm) >= 1 && Math.abs(am - tm) <= 4) return 'minOne';   // 差 1～4 分：小格數錯（只有等級 3 一分一格會出現）
  if (ah === th && Math.abs(am - tm) <= 5) return 'minNear';
  if (am === tm) return 'hourOff';
  return 'other';
}

    const err = Math.max(...fs.map(f => f.err)), n = fs.reduce((a, f) => a + f.n, 0), w = fs.reduce((a, f) => a + f.w, 0);

    const top = Object.entries(DB.errs).filter(([k, v]) => ERRS.includes(k) && v >= 0.2).sort((a, b) => b[1] - a[1])[0];

  function finger(on) { const el = $('#tut-finger'), st = STEPS[S.i]; if (!on || !st) { el.hidden = true; return; } const a = clock6.get().tot, base = st.only === 'm' ? (a % 60) * 6 : ((a / 60) % 12) * 30, d = st.to === null ? 360 : (((st.to - base) % 360) + 360) % 360 || 360; el.style.setProperty('--a0', base + 'deg'); el.style.setProperty('--a1', (base + d) + 'deg'); el.style.setProperty('--r', st.r + '%'); el.hidden = true; void el.offsetWidth; el.hidden = false; }

  WHO.list.push({ id, name }); saveWho();
  try { localStorage.setItem(keyFor(id), JSON.stringify(Object.assign(fresh(), { tut: false, set: Object.assign(fresh().set, { lang, sound: DB.set.sound, music: DB.set.music, chime: DB.set.chime }) }))); } catch (e) {}   // 新的人沿用剛剛的語言和聲音設定，tut:false 讓他先玩教學
  $('#who-in').value = ''; $('#o-who').hidden = true; switchWho(id); SFX.ding(); toast(tx('who.welcome', { name }));
});
$('#who-rename').addEventListener('click', () => {
  const name = whoName(); if (!name) { $('#who-in').focus(); toast(tx('who.need')); return; }
  if (whoTaken(name) && whoCur().name !== name) { toast(tx('who.taken')); return; }
  const first = !whoCur().name; whoCur().name = name; saveWho(); renderWho(); whoChip(); $('#who-in').value = ''; $('#who-in').blur(); SFX.ding(); toast(tx('who.hi', { name }));
  if (first) $('#o-who').hidden = true;
});
$('#who-in').addEventListener('keydown', e => { e.stopPropagation(); if (e.key !== 'Enter') return; e.preventDefault(); if (!whoCur().name || WHO.list.length >= WHO_MAX) $('#who-rename').click(); else $('#who-add').click(); });
// 家長區：刪除目前的玩家（名字和紀錄）；只剩一個人時就變回沒有名字的新玩家
$('#set-del').addEventListener('click', () => {
  const me = whoCur();
  Gate.open(() => {
    try { localStorage.removeItem(keyFor(me.id)); } catch (e) {}
    WHO.list = WHO.list.filter(x => x.id !== me.id); if (!WHO.list.length) WHO.list = [{ id: '', name: '' }];
    saveWho(); $('#o-set').hidden = true; switchWho(WHO.list[0].id, true); toast(tx('who.cleared', { name: whoLabel(me) }));
  }, true);
});

// ---------- 備份紀錄（匯出／匯入，照九九）：網頁版和 App 版的 localStorage 分開，要靠備份搬
// 內容是 WHO 加每個人的存檔原文；匯出成 .json 檔或備份碼（BK_PRE + base64）；匯入取代這台裝置所有人的紀錄（家長關卡），寫完重新載入，存檔照常經過 loadDB() 消毒
const BK_APP = 'tick-town', BK_PRE = 'TTWN1:', BK_DONE = 'tick-town-bk-done';
let bkPending = null;
const bkMsg = (t, bad) => { const m = $('#bk-msg'); m.textContent = t; m.classList.toggle('bad', !!bad); };
const dateStr = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function backupObj() { save(); const saves = {}; WHO.list.forEach(x => { const k = keyFor(x.id); try { const r = localStorage.getItem(k); if (r) saves[k] = JSON.parse(r); } catch (e) {} }); return { app: BK_APP, v: 1, at: new Date().toISOString(), who: { cur: WHO.cur, list: WHO.list }, saves }; }
const b64e = t => { const u = new TextEncoder().encode(t); let b = ''; for (let i = 0; i < u.length; i += 0x8000) b += String.fromCharCode.apply(null, u.subarray(i, i + 0x8000)); return btoa(b); };
const b64d = t => new TextDecoder().decode(Uint8Array.from(atob(t), c => c.charCodeAt(0)));
function bkParse(text) {
  text = String(text || '').trim(); if (!text || text.length > 4e6) return null;
  try {
    let o = null; const i = text.indexOf(BK_PRE);
    if (i >= 0) { const t = (text.slice(i + BK_PRE.length).replace(/\s+/g, '').match(/^[A-Za-z0-9+/]*={0,2}/) || [''])[0]; for (let L = t.length - t.length % 4, end = Math.max(0, L - 64); L > end && !o; L -= 4) { try { o = JSON.parse(b64d(t.slice(0, L))); } catch (e) {} } }   // 備份碼前後多貼了字也沒關係
    else o = JSON.parse(text);
    if (!o || o.app !== BK_APP || !o.who || !Array.isArray(o.who.list) || !o.saves || typeof o.saves !== 'object') return null;
    const list = o.who.list.filter(x => x && typeof x.id === 'string' && (x.id === '' || /^p[0-9a-z]{1,16}$/.test(x.id))).filter((x, i, a) => a.findIndex(y => y.id === x.id) === i).slice(0, WHO_MAX).map(x => ({ id: x.id, name: String(x.name || '').slice(0, 10) }));
    if (!list.length) return null;
    const saves = {}; list.forEach(x => { const sv = o.saves[keyFor(x.id)]; if (sv && typeof sv === 'object' && !Array.isArray(sv)) saves[keyFor(x.id)] = sv; });
    return { at: typeof o.at === 'string' ? o.at.slice(0, 10) : '', who: { cur: list.some(x => x.id === o.who.cur) ? o.who.cur : list[0].id, list }, saves };
  } catch (e) { return null; }
}
function openBackup() { bkPending = null; $('#bk-out').hidden = true; $('#bk-out').value = ''; $('#bk-in').value = ''; $('#bk-confirm').hidden = true; bkMsg(''); $('#o-set').hidden = true; $('#o-bk').hidden = false; $('#o-bk .card').scrollTop = 0; }
async function bkFile() {
  const text = JSON.stringify(backupObj()), name = `tick-town-backup-${dateStr()}.json`;
  try { const f = new File([text], name, { type: 'application/json' }); if (navigator.canShare && navigator.canShare({ files: [f] })) { await navigator.share({ files: [f], title: name }); bkMsg(tx('bk.saved')); return; } } catch (e) { if (e && e.name === 'AbortError') return; }   // iPad／手機：分享面板
  if (window.Capacitor) return bkCopy();   // App 的 WebView 不能下載，改給備份碼
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([text], { type: 'application/json' })); a.download = name; document.body.appendChild(a); a.click(); setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 1500); bkMsg(tx('bk.saved'));
}
async function bkCopy() { const code = BK_PRE + b64e(JSON.stringify(backupObj())), out = $('#bk-out'); out.value = code; out.hidden = false; try { await navigator.clipboard.writeText(code); bkMsg(tx('bk.copied')); } catch (e) { out.focus(); out.select(); bkMsg(tx('bk.copyManual')); } }
function bkCheck(text) { const b = bkParse(text); bkPending = b; $('#bk-confirm').hidden = !b; if (!b) { bkMsg(tx('bk.bad'), true); return; } bkMsg(tx('bk.found', { n: b.who.list.length, names: b.who.list.map(x => x.name || tx('who.noName')).join(tx('sep')), date: b.at || '?' })); }
function bkApply(b) {   // 取代：舊的人在備份裡沒有的存檔刪掉，寫入備份的每個人與 WHO，然後重新載入（期間 bkFrozen 擋住記憶體裡的舊資料寫回）
  bkFrozen = true;
  try { WHO.list.forEach(x => { const k = keyFor(x.id); if (!(k in b.saves)) localStorage.removeItem(k); }); b.who.list.forEach(x => { const k = keyFor(x.id); if (b.saves[k]) localStorage.setItem(k, JSON.stringify(b.saves[k])); else localStorage.removeItem(k); }); localStorage.setItem(PKEY, JSON.stringify(b.who)); }
  catch (e) { bkFrozen = false; save(); saveWho(); return false; }
  try { sessionStorage.setItem(BK_DONE, '1'); } catch (e) {}
  location.reload(); return true;
}
$('#go-backup').addEventListener('click', openBackup);   // 匯出不改紀錄，不用家長關卡；匯入按「確定匯入」才要
$('#bk-file').addEventListener('click', bkFile);
$('#bk-copy').addEventListener('click', bkCopy);
$('#bk-pick').addEventListener('click', () => { $('#bk-in-file').value = ''; $('#bk-in-file').click(); });
$('#bk-in-file').addEventListener('change', e => { const f = e.target.files && e.target.files[0]; if (!f) return; if (f.size > 4e6) { bkMsg(tx('bk.bad'), true); return; } const r = new FileReader(); r.onload = () => bkCheck(r.result); r.onerror = () => bkMsg(tx('bk.bad'), true); r.readAsText(f); });
$('#bk-paste').addEventListener('click', () => bkCheck($('#bk-in').value));
$('#bk-in').addEventListener('keydown', e => e.stopPropagation());
$('#bk-yes').addEventListener('click', () => { const b = bkPending; if (!b) return; Gate.open(() => { if (!bkApply(b)) bkMsg(tx('bk.fail'), true); }, true); });
$('#bk-no').addEventListener('click', () => { bkPending = null; $('#bk-confirm').hidden = true; bkMsg(''); });
$('#bk-close').addEventListener('click', () => { $('#o-bk').hidden = true; renderSet(); $('#o-set').hidden = false; });   // 從設定打開的，關掉回到設定
try { if (sessionStorage.getItem(BK_DONE)) { sessionStorage.removeItem(BK_DONE); setTimeout(() => toast(tx('bk.done')), 400); } } catch (e) {}

// ---------- 開始
fillIcons(); loadDB(); setLang(); setRingAll(DB.set.ring); Town.resize(); Music.track(Music.forTime(DB.free)); Music.start();
if (DB.hinted) $('#hintline').hidden = true; refreshMenu(); whoChip(); renderLocks();
setTimeout(() => { const sp = $('#splash'); if (sp) sp.remove(); }, 1900);
if (!DB.tut) Tut.start(false);
clock.setSnap(DB.set.level === 3 ? 1 : 5); clock.set(Math.floor(DB.free / 60), DB.free % 60); showTime(clock.get().tot);
document.fonts && document.fonts.ready.then(() => Town.resize());
window.__tt = { Report, clock, clock2, clock3, DB: () => DB, Town, timeWords, Day, Read, Match, Versus, clockA, clockB, clock5, clock6, Shop, Tut, Music, SFX, WHO: () => WHO, keyFor, bkParse, Map: StarMap, Quest, Gate, Pet, petSVG, classifySet, timeline, townPts, townGrow, DECOR, UL: () => UL, APP };   // 給測試用
})();
</script>
