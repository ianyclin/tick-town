<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="description" content="滴答小鎮：給小學生看時鐘、撥時鐘、算時間的遊戲。沒有廣告、不用網路。">
<title>滴答小鎮</title>
<style>
@font-face{font-family:'Lilita';src:url(assets/fonts/lilita.woff2) format('woff2');font-display:swap}
@font-face{font-family:'Chiron';src:url(assets/fonts/chiron-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'Chiron';src:url(assets/fonts/chiron-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'Chiron';src:url(assets/fonts/chiron-900.woff2) format('woff2');font-weight:900;font-display:swap}
@font-face{font-family:'ZenMaru';src:url(assets/fonts/zenmaru-400.woff2) format('woff2');font-weight:400;font-display:swap}
@font-face{font-family:'ZenMaru';src:url(assets/fonts/zenmaru-700.woff2) format('woff2');font-weight:700;font-display:swap}
@font-face{font-family:'ZenMaru';src:url(assets/fonts/zenmaru-900.woff2) format('woff2');font-weight:900;font-display:swap}
:root{
  --f-num:'Lilita','Chiron',"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-zh:'Chiron',"PingFang TC","Noto Sans TC","Microsoft JhengHei",system-ui,sans-serif;
  --ink:#3b2f2f;--muted:#7a6a5a;--paper:#fff8ea;--panel:rgba(255,255,255,.82);--line:rgba(90,60,30,.18);
  --sun:#ffb340;--hour:#3a7bd5;--minute:#e8514f;--mint:#5fcf9a;--coral:#ff7a6b;
  --face:#fffaf0;--face-rim:#e8c98f;
  padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);
}
:lang(ja){--f-zh:'ZenMaru',"Hiragino Maru Gothic ProN","Yu Gothic",system-ui,sans-serif;--f-num:'Lilita','ZenMaru',system-ui,sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overscroll-behavior:none}
body{font-family:var(--f-zh);color:var(--ink);background:#8fd0ff;overflow:hidden;position:fixed;inset:0;touch-action:manipulation;user-select:none;-webkit-user-select:none}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
[hidden]{display:none!important}
#town{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;padding:10px 16px;z-index:1;gap:8px}
.top{width:100%;max-width:520px;display:flex;align-items:center;justify-content:space-between}
h1{margin:0;font-size:26px;font-weight:900;letter-spacing:1px;color:#fff;text-shadow:0 2px 0 rgba(0,0,0,.18),0 0 18px rgba(255,255,255,.4)}
.icon-btn{min-width:44px;min-height:44px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-size:22px;display:grid;place-items:center;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.clock-wrap{width:min(78vw,44vh,360px);aspect-ratio:1;position:relative;margin-top:4px}
.clock-wrap svg{width:100%;height:100%;overflow:visible;display:block;touch-action:none}
.hand{cursor:grab}.hand.on{cursor:grabbing}
.knob{fill:transparent;pointer-events:all}
.timecard{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:8px 18px;text-align:center;min-width:200px;max-width:100%;box-shadow:0 4px 0 rgba(0,0,0,.06);backdrop-filter:blur(6px)}
.digital{font-family:var(--f-num);font-size:40px;line-height:1;letter-spacing:1px}
.digital small{font-size:18px;color:var(--muted);margin-left:6px;font-family:var(--f-zh);font-weight:700}
.words{font-size:18px;font-weight:900;margin-top:2px;text-wrap:balance}
.scene{font-size:17px;font-weight:700;color:var(--muted);margin-top:2px;min-height:24px}
.scene .emo{font-size:22px;vertical-align:-2px;margin-right:4px}
.hintline{color:#fff;font-weight:900;font-size:15px;text-shadow:0 1px 0 rgba(0,0,0,.25);text-align:center;text-wrap:balance;margin-top:-2px}
.modes{margin-top:auto;width:100%;max-width:520px;display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;padding-bottom:6px}
.mode{background:var(--panel);border:1px solid var(--line);border-radius:20px;min-height:76px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-weight:900;font-size:14px;line-height:1.2;text-align:center;box-shadow:0 4px 0 rgba(0,0,0,.08);text-wrap:balance;padding:6px 4px}
.mode .emo{font-size:30px;line-height:1}
.mode:active{transform:translateY(2px);box-shadow:0 2px 0 rgba(0,0,0,.08)}
.mode.soon{opacity:.55}
.overlay{position:fixed;inset:0;background:rgba(40,30,20,.45);display:grid;place-items:center;z-index:6;padding:16px}
.card{background:var(--paper);border-radius:24px;padding:18px;width:100%;max-width:420px;max-height:calc(100% - 20px);overflow-y:auto;display:flex;flex-direction:column;gap:12px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.card>*{flex-shrink:0}
.hhead{display:flex;align-items:center;justify-content:space-between;position:sticky;top:-18px;background:var(--paper);padding-top:2px;margin-top:-2px;z-index:1}
.hhead h3{margin:0;font-size:22px;font-weight:900}
.xbtn{min-width:44px;min-height:44px;border-radius:999px;font-size:22px;background:rgba(0,0,0,.06)}
.lab{font-size:14px;color:var(--muted);font-weight:700}
.langs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.langs button,.sw{min-height:44px;border-radius:14px;border:2px solid var(--line);font-weight:900;font-size:16px;background:#fff}
.langs button[aria-pressed=true],.sw[aria-pressed=true]{border-color:var(--hour);background:#e4efff;color:var(--hour)}
.row{display:flex;align-items:center;justify-content:space-between;gap:10px}
.sw{min-width:72px;padding:0 14px}
.toast{position:fixed;left:50%;bottom:calc(110px + env(safe-area-inset-bottom));transform:translateX(-50%);background:rgba(59,47,47,.92);color:#fff;padding:12px 18px;border-radius:999px;font-weight:900;font-size:16px;z-index:9;max-width:calc(100% - 32px);text-align:center;text-wrap:balance;pointer-events:none;animation:toastIn .25s ease}
@keyframes toastIn{from{opacity:0;transform:translateX(-50%) translateY(8px)}}
.chip{min-height:44px;border-radius:999px;background:var(--panel);border:1px solid var(--line);padding:0 14px;font-weight:900;font-size:15px;display:inline-flex;align-items:center;gap:6px;box-shadow:0 2px 0 rgba(0,0,0,.08);position:relative}
.chip.todo::after{content:'';position:absolute;top:-2px;right:-2px;width:12px;height:12px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 2px #fff}
.chip.ok{background:#dff7ea;border-color:var(--mint)}
.qlist{display:flex;flex-direction:column;gap:8px}
.q{display:flex;align-items:center;gap:10px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:10px 12px;font-weight:700;font-size:16px}
.q .em{font-size:26px}.q .bar{flex:1;height:10px;border-radius:5px;background:rgba(0,0,0,.08);overflow:hidden}.q .bar i{display:block;height:100%;background:var(--mint);border-radius:5px}
.q.done{background:#dff7ea;border-color:var(--mint)}
.q small{color:var(--muted);font-family:var(--f-num);font-size:14px}
.badges{display:flex;justify-content:space-between;font-weight:900;font-size:15px;color:var(--muted)}
.gate-q{font-family:var(--f-num);font-size:34px;text-align:center;line-height:1.2}
.gate-a{display:flex;justify-content:center;gap:8px}.gate-a i{width:40px;height:50px;border-radius:12px;border:2px solid var(--line);background:#fff;display:grid;place-items:center;font-family:var(--f-num);font-size:28px;font-style:normal}
.danger{min-height:44px;border-radius:999px;border:2px solid var(--coral);color:#c0392b;font-weight:900;font-size:15px;padding:0 16px;background:#fff}
.lab.parent{margin-top:8px;border-top:1px solid var(--line);padding-top:10px}
.mgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:420px;margin-top:4px}
.mcard{aspect-ratio:1;perspective:600px;min-height:44px}
.mcard .inner{position:relative;width:100%;height:100%;transition:transform .35s;transform-style:preserve-3d}
.mcard.open .inner,.mcard.done .inner{transform:rotateY(180deg)}
.mcard .f{position:absolute;inset:0;border-radius:18px;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:grid;place-items:center;border:2px solid var(--line);box-shadow:0 4px 0 rgba(0,0,0,.08)}
.mcard .bk{background:linear-gradient(160deg,#ffd27a,#ffb340);font-size:34px}
.mcard .fr{background:var(--panel);transform:rotateY(180deg);overflow:hidden;padding:6px}
.mcard .fr svg{width:100%;height:100%;overflow:visible}
.mcard .fr .dg{font-family:var(--f-num);font-size:clamp(20px,7vw,32px);color:var(--hour)}
.mcard .fr .wd{font-weight:900;font-size:clamp(13px,4vw,17px);text-align:center;line-height:1.3;text-wrap:balance}
.mcard.done .fr{background:#dff7ea;border-color:var(--mint)}
.mcard.no .inner{animation:tilt .5s ease}
@media (prefers-reduced-motion:reduce){.mcard .inner{transition:none}}
#s-versus{padding:0;touch-action:none;gap:0}
.half{flex:1;width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:8px 12px;min-height:0;position:relative}
.half.flip{transform:rotate(180deg);background:rgba(255,255,255,.12)}
.half .clock-wrap{width:min(56vw,30vh,260px);margin:0}
.vtask{background:var(--panel);border:1px solid var(--line);border-radius:999px;padding:6px 16px;font-weight:900;font-size:17px;display:flex;align-items:center;gap:8px}
.vtask b{font-family:var(--f-num);font-size:24px;color:var(--hour);font-weight:400}
.vtask .emo{font-size:22px}
.vmid{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;background:var(--panel);border-top:1px solid var(--line);border-bottom:1px solid var(--line);padding:4px 10px;font-family:var(--f-num);font-size:22px;position:relative}
.vmid .dots{display:flex;gap:5px}.vmid .dots i{width:14px;height:14px;border-radius:50%;background:rgba(0,0,0,.12)}.vmid .dots i.on{background:var(--sun);box-shadow:0 0 6px var(--sun)}
.vmid .link-btn{position:absolute;left:10px;top:50%;transform:translateY(-50%);min-height:36px;font-size:14px;padding:0 10px}
.robot{font-size:64px;line-height:1;transition:transform .2s}.robot.think{animation:robotThink 1s ease-in-out infinite}
@keyframes robotThink{50%{transform:rotate(6deg) translateY(-3px)}}
.vbar{width:160px;height:10px;border-radius:5px;background:rgba(0,0,0,.1);overflow:hidden}.vbar i{display:block;height:100%;background:var(--mint);width:0}
.vgot{animation:jump .6s ease}
.opt-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt-row button{min-height:48px;border-radius:14px;border:2px solid var(--line);background:#fff;font-weight:900;font-size:16px}
.opt-row button[aria-pressed=true]{border-color:var(--hour);background:#e4efff;color:var(--hour)}
@media (max-height:640px){.half .clock-wrap{width:min(50vw,27vh,220px)}.robot{font-size:44px}.vtask{font-size:14px}.vtask b{font-size:20px}}
.help h4{margin:10px 0 4px;font-size:17px;color:var(--hour)}
.help ul{margin:0;padding-left:18px;font-size:15px;line-height:1.55}
.help li{margin-bottom:4px;text-wrap:pretty}
.help li b{color:#c0392b}
.about p{text-align:left;font-size:15px;line-height:1.55}
.about h4{margin:8px 0 2px;font-size:16px}
.linkrow{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.linkrow .link-btn{text-align:center}
.legal{font-size:11px;color:var(--muted);text-align:center;margin-top:6px}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:5;pointer-events:none}
.link-btn{min-height:44px;padding:0 14px;border-radius:999px;background:var(--panel);border:1px solid var(--line);font-weight:900;font-size:16px;box-shadow:0 2px 0 rgba(0,0,0,.08)}
.lights{background:var(--panel);border:1px solid var(--line);border-radius:999px;min-height:44px;display:flex;align-items:center;padding:0 14px;font-family:var(--f-num);font-size:20px;gap:6px}
.task{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:10px 14px;display:flex;align-items:center;gap:12px;width:100%;max-width:520px;box-shadow:0 4px 0 rgba(0,0,0,.06);backdrop-filter:blur(6px)}
.task .emo{font-size:44px;line-height:1;flex:none;display:inline-block}
.task .emo.jump{animation:jump .7s ease}
.task .emo.tilt{animation:tilt .8s ease}
@keyframes jump{30%{transform:translateY(-18px) rotate(-8deg)}60%{transform:translateY(0) scale(1.1,.9)}80%{transform:translateY(-6px)}}
@keyframes tilt{25%{transform:rotate(-14deg)}60%{transform:rotate(10deg)}}
.task .say{font-size:17px;font-weight:900;line-height:1.35;text-wrap:pretty;flex:1}
.task .target{font-family:var(--f-num);font-size:34px;line-height:1;color:var(--hour);flex:none}
.task .target small{display:block;font-family:var(--f-zh);font-size:13px;color:var(--muted);font-weight:700;text-align:center}
.timecard.small{padding:6px 16px;min-width:160px}
.timecard.small .words{font-size:20px;margin:0}
.bubble{background:#fff;border:2px solid var(--sun);border-radius:18px;padding:10px 14px;font-weight:900;font-size:16px;max-width:520px;width:100%;text-align:center;text-wrap:pretty;line-height:1.4;box-shadow:0 4px 0 rgba(0,0,0,.08);animation:toastIn .25s ease}
.bubble.good{border-color:var(--mint)}
.ghost{stroke:#9a8c7c;stroke-width:4;stroke-dasharray:6 5;stroke-linecap:round;fill:none;opacity:.9}
.cnt{font-family:var(--f-num);font-size:11px;fill:#c0392b;font-weight:700;text-anchor:middle}
.btn{min-height:52px;padding:0 24px;border-radius:999px;background:var(--sun);color:#3b2f2f;font-weight:900;font-size:19px;box-shadow:0 5px 0 #d4922a}
.btn.alt{background:#fff;box-shadow:0 5px 0 rgba(0,0,0,.12)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #d4922a}
.card .btn{width:100%}
.card p{margin:0;font-size:17px;line-height:1.5;text-align:center;text-wrap:pretty}
.card .big{font-size:56px;text-align:center;line-height:1}
.opts{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%;max-width:520px}
.opt{min-height:64px;border-radius:18px;background:var(--panel);border:2px solid var(--line);font-family:var(--f-num);font-size:30px;box-shadow:0 4px 0 rgba(0,0,0,.08);transition:transform .1s}
.opt:active{transform:translateY(2px)}
.opt.no{opacity:.4;border-style:dashed;animation:tilt .5s ease}
.opt.yes{background:#dff7ea;border-color:var(--mint);box-shadow:0 0 0 4px rgba(95,207,154,.35)}
.pad{width:100%;max-width:360px;display:flex;flex-direction:column;align-items:center;gap:8px}
.padin{font-family:var(--f-num);font-size:38px;line-height:1;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:8px 22px;min-width:150px;text-align:center;letter-spacing:2px}
.padin.no{animation:tilt .5s ease;color:var(--coral)}
.keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;width:100%}
.key{min-height:52px;border-radius:16px;background:var(--panel);border:1px solid var(--line);font-family:var(--f-num);font-size:26px;box-shadow:0 3px 0 rgba(0,0,0,.08)}
.key.ok{background:var(--sun);font-family:var(--f-zh);font-weight:900;font-size:20px;box-shadow:0 3px 0 #d4922a}
.key:active{transform:translateY(2px)}
.map-wrap{width:min(88vw,46vh,420px);aspect-ratio:1}
.map-wrap svg{width:100%;height:100%;overflow:visible;display:block}
.cell{stroke:rgba(255,255,255,.7);stroke-width:.6;cursor:pointer}
.cell.new{fill:rgba(255,255,255,.35)}.cell.learn{fill:#ffcf7a}.cell.weak{fill:#ff8a7a}.cell.star{fill:#ffd23f}
.cell.dim{opacity:.25}
.sec-on .cell{opacity:.35}.sec-on .cell.on{opacity:1;stroke:#fff;stroke-width:1}
.mlab{font-family:var(--f-num);font-size:9px;fill:#fff;text-anchor:middle;paint-order:stroke;stroke:rgba(0,0,0,.35);stroke-width:2px}
.legend{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;font-size:13px;font-weight:700;color:#fff;text-shadow:0 1px 0 rgba(0,0,0,.3)}
.legend i{display:inline-block;width:12px;height:12px;border-radius:4px;vertical-align:-1px;margin-right:4px;border:1px solid rgba(255,255,255,.7)}
.info{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px 14px;font-size:15px;line-height:1.5;width:100%;max-width:520px;min-height:48px;text-wrap:pretty;backdrop-filter:blur(6px)}
.info b{color:var(--hour)}
.hrow{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:3px;margin-top:6px}
.hrow span{display:grid;place-items:center;height:28px;border-radius:7px;font-family:var(--f-num);font-size:14px;background:rgba(255,255,255,.5)}
.hrow span.learn{background:#ffcf7a}.hrow span.weak{background:#ff8a7a}.hrow span.star{background:#ffd23f}
@media (max-height:640px){.key{min-height:46px;font-size:22px}.opt{min-height:54px;font-size:26px}.padin{font-size:30px}.task .emo{font-size:34px}.task .say{font-size:15px}.task .target{font-size:28px}.digital{font-size:32px}.words{font-size:16px}.mode{min-height:64px}.mode .emo{font-size:24px}h1{font-size:22px}}
@media (min-width:700px) and (min-height:700px){.clock-wrap{width:min(60vw,48vh,440px)}.modes{max-width:600px}.mode{min-height:92px;font-size:16px}}
@media (prefers-reduced-motion:reduce){*{animation-duration:.01ms!important;transition-duration:.01ms!important}}
</style>
</head>
<body>
<canvas id="town"></canvas>

<section class="screen" id="s-menu">
  <div class="top">
    <h1 data-t="title"></h1>
    <div style="display:flex;gap:8px"><button class="chip" id="go-quest" type="button"><span aria-hidden="true">📋</span><b id="q-count"></b></button><button class="icon-btn" id="go-map" type="button" data-ta="menu.map">🗺️</button><button class="icon-btn" id="go-set" type="button" data-ta="menu.set">⚙️</button></div>
  </div>
  <div class="clock-wrap" id="clock"></div>
  <div class="timecard">
    <div class="digital" id="digital"></div>
    <div class="words" id="words"></div>
    <div class="scene" id="scene"></div>
  </div>
  <div class="hintline" id="hintline" data-t="menu.hint"></div>
  <div class="modes" id="modes">
    <button class="mode" type="button" data-mode="day"><span class="emo">🏘️</span><span data-t="mode.day"></span></button>
    <button class="mode" type="button" data-mode="read"><span class="emo">⏰</span><span data-t="mode.read"></span></button>
    <button class="mode" type="button" data-mode="match"><span class="emo">🃏</span><span data-t="mode.match"></span></button>
    <button class="mode" type="button" data-mode="versus"><span class="emo">🤝</span><span data-t="mode.versus"></span></button>
  </div>
</section>

<section class="screen" id="s-day" hidden>
  <div class="top"><button class="link-btn" type="button" data-home data-t="back"></button><div class="lights" id="day-lights" aria-live="polite"></div></div>
  <div class="task" id="day-task"><span class="emo" id="day-emo">🐻</span><div class="say" id="day-say"></div><div class="target" id="day-target"></div></div>
  <div class="clock-wrap" id="clock2"></div>
  <div class="timecard small"><div class="words" id="day-words"></div></div>
  <div class="bubble" id="day-hint" hidden></div>
</section>

<section class="screen" id="s-read" hidden>
  <div class="top"><button class="link-btn" type="button" data-home data-t="back"></button><div class="lights" id="read-prog" aria-live="polite"></div></div>
  <div class="task"><span class="emo" id="read-emo">🦉</span><div class="say" id="read-say"></div></div>
  <div class="clock-wrap" id="clock3"></div>
  <div class="opts" id="read-opts"></div>
  <div class="pad" id="read-pad" hidden><div class="padin" id="read-in"></div><div class="keys" id="read-keys"></div></div>
  <div class="bubble" id="read-hint" hidden></div>
</section>

<section class="screen" id="s-match" hidden>
  <div class="top"><button class="link-btn" type="button" data-home data-t="back"></button><div class="lights" id="match-prog" aria-live="polite"></div></div>
  <div class="task"><span class="emo" id="match-emo">🐿️</span><div class="say" data-t="match.say"></div></div>
  <div class="mgrid" id="mgrid"></div>
  <div class="bubble" id="match-hint" hidden></div>
</section>

<div class="overlay" id="o-mdone" hidden>
  <div class="card">
    <div class="big">🎉</div>

const SFX = {
  tone(f, t, len, type = 'sine', gain = 0.2, sweep) { const c = ac(); if (!c || !DB.set.sound) return; const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.setValueAtTime(f, t); if (sweep) o.frequency.exponentialRampToValueAtTime(sweep, t + len); g.gain.setValueAtTime(gain, t); g.gain.exponentialRampToValueAtTime(0.0001, t + len); o.connect(g).connect(c.destination); o.start(t); o.stop(t + len + 0.02); },
  tick() { const c = ac(); if (!c) return; this.tone(1400, c.currentTime, 0.035, 'square', 0.06, 700); },
  bell() { const c = ac(); if (!c) return; const t = c.currentTime; this.tone(880, t, 1.4, 'sine', 0.22); this.tone(1320, t, 1.0, 'sine', 0.1); this.tone(2640, t, 0.5, 'sine', 0.05); this.tone(440, t, 1.6, 'triangle', 0.08); },
  hm() { const c = ac(); if (!c) return; this.tone(330, c.currentTime, 0.25, 'triangle', 0.12, 260); },   // 動物歪頭「咦？」：短短一聲，不像失敗音
  ding() { const c = ac(); if (!c) return; const t = c.currentTime; this.tone(1047, t, 0.25, 'triangle', 0.18); this.tone(1568, t + 0.08, 0.3, 'triangle', 0.14); },

// ---------- 鐘面元件：烏龜是時針（短、慢、藍）、兔子是分針（長、快、紅）
function Clock(el, opts = {}) {
  const C = 100, snap = () => opts.snap || 5;

  const mk = (n, a = {}) => { const e = document.createElementNS(svgNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
  const svg = mk('svg', { viewBox: '0 0 200 200', role: 'img' });

  svg.appendChild(mk('circle', { cx: C, cy: C, r: 96, fill: '#e8c98f' }));
  svg.appendChild(mk('circle', { cx: C, cy: C, r: 90, fill: 'var(--face)' }));
  for (let i = 0; i < 60; i++) { const big = i % 5 === 0, a = i * 6 * Math.PI / 180, r1 = big ? 78 : 83, r2 = 87; svg.appendChild(mk('line', { x1: C + r1 * Math.sin(a), y1: C - r1 * Math.cos(a), x2: C + r2 * Math.sin(a), y2: C - r2 * Math.cos(a), stroke: big ? '#5b4a3a' : '#b9a58c', 'stroke-width': big ? 3 : 1.5, 'stroke-linecap': 'round' })); }
  for (let n = 1; n <= 12; n++) { const a = n * 30 * Math.PI / 180, t = mk('text', { x: C + 66 * Math.sin(a), y: C - 66 * Math.cos(a) + 7, 'text-anchor': 'middle', 'font-size': 19, 'font-weight': 900, fill: '#3b2f2f', 'font-family': 'var(--f-num)' }); t.textContent = n; svg.appendChild(t); }
  // 時針：烏龜
  const gh = mk('g', { class: 'hand hour' });
  gh.appendChild(mk('rect', { x: C - 5, y: C - 50, width: 10, height: 58, rx: 5, fill: 'var(--hour)' }));
  const tort = mk('g', { transform: `translate(${C} ${C - 52})` });
  tort.appendChild(mk('ellipse', { cx: 0, cy: 0, rx: 12, ry: 10, fill: '#7fc24a', stroke: '#4f8f2a', 'stroke-width': 2 }));
  tort.appendChild(mk('path', { d: 'M-7 -3 Q0 -9 7 -3 M-4 2 Q0 5 4 2', fill: 'none', stroke: '#4f8f2a', 'stroke-width': 1.5 }));
  tort.appendChild(mk('circle', { cx: -4, cy: -2, r: 1.8, fill: '#223' })); tort.appendChild(mk('circle', { cx: 4, cy: -2, r: 1.8, fill: '#223' }));
  gh.appendChild(tort);
  gh.appendChild(mk('circle', { class: 'knob', cx: C, cy: C - 52, r: 23 }));
  // 分針：兔子
  const gm = mk('g', { class: 'hand minute' });
  gm.appendChild(mk('rect', { x: C - 3.5, y: C - 76, width: 7, height: 84, rx: 3.5, fill: 'var(--minute)' }));
  const rab = mk('g', { transform: `translate(${C} ${C - 78})` });
  rab.appendChild(mk('ellipse', { cx: -4, cy: -13, rx: 3, ry: 8, fill: '#fff', stroke: '#e3a3a3', 'stroke-width': 1.5 }));
  rab.appendChild(mk('ellipse', { cx: 4, cy: -13, rx: 3, ry: 8, fill: '#fff', stroke: '#e3a3a3', 'stroke-width': 1.5 }));
  rab.appendChild(mk('circle', { cx: 0, cy: 0, r: 10, fill: '#fff', stroke: '#e3a3a3', 'stroke-width': 2 }));
  rab.appendChild(mk('circle', { cx: -3.5, cy: -1.5, r: 1.8, fill: '#223' })); rab.appendChild(mk('circle', { cx: 3.5, cy: -1.5, r: 1.8, fill: '#223' }));
  rab.appendChild(mk('ellipse', { cx: 0, cy: 3, rx: 2, ry: 1.4, fill: '#f08a8a' }));
  gm.appendChild(rab);
  gm.appendChild(mk('circle', { class: 'knob', cx: C, cy: C - 78, r: 23 }));
  svg.appendChild(gh); svg.appendChild(gm);
  svg.appendChild(mk('circle', { cx: C, cy: C, r: 6, fill: '#5b4a3a' }));
  el.appendChild(svg);

  let tot = 0;   // 一天裡的第幾分鐘（0～1439），可以是小數（拖的時候）
  const api = { el: svg, onChange: null, onSnap: null, drag: opts.drag !== false };
  const render = () => { const m = tot % 60, h = (tot / 60) % 12; gm.setAttribute('transform', `rotate(${m * 6} ${C} ${C})`); gh.setAttribute('transform', `rotate(${h * 30} ${C} ${C})`); };
  const snapped = v => ((Math.round(v / snap()) * snap()) % 1440 + 1440) % 1440;
  api.set = (h, m) => { tot = ((h * 60 + m) % 1440 + 1440) % 1440; render(); };
  api.get = () => { const s = snapped(tot); return { h: Math.floor(s / 60), m: s % 60, tot: s }; };
  api.setSnap = v => { opts.snap = v; };
  // 拖：用連續角度累計，跨 12 點時小時跟著進位；時針拖的時候吸附到半點
  let drag = null;
  const ang = e => { const r = svg.getBoundingClientRect(), x = e.clientX - r.left - r.width / 2, y = e.clientY - r.top - r.height / 2; return Math.atan2(x, -y) * 180 / Math.PI; };
  const down = which => e => {
    if (!api.drag || drag) return; e.preventDefault(); ac();   // 第二根手指不理（兩指同時按會把角度算亂）
    drag = { id: e.pointerId, which, prev: ang(e), last: snapped(tot), m0: snapped(tot) % 60 }; svg.setPointerCapture(e.pointerId); (which === 'm' ? gm : gh).classList.add('on');
  };
  const hourSnap = () => (((Math.round((tot - drag.m0) / 60) * 60 + drag.m0) % 1440) + 1440) % 1440;   // 拖烏龜：分針不動，只換小時
  svg.addEventListener('pointermove', e => {

  const up = e => { if (!drag || (e && e.pointerId !== undefined && e.pointerId !== drag.id)) return; tot = drag.which === 'm' ? snapped(tot) : hourSnap(); (drag.which === 'm' ? gm : gh).classList.remove('on'); drag = null; render(); if (api.onChange) api.onChange(tot, false); };
  // 虛線指針：提示正確位置（畫在真的指針下面）
  const gg = mk('g', { class: 'ghostg' }); svg.insertBefore(gg, gh);
  api.ghost = (h, m) => { gg.innerHTML = ''; if (h === null || h === undefined) return; const ma = (m % 60) * 6, ha = ((h % 12) + m / 60) * 30; gg.appendChild(mk('line', { class: 'ghost', x1: C, y1: C, x2: C, y2: C - 50, transform: `rotate(${ha} ${C} ${C})` })); gg.appendChild(mk('line', { class: 'ghost', x1: C, y1: C, x2: C, y2: C - 76, transform: `rotate(${ma} ${C} ${C})` })); };

  api.countStop = () => { cntT.forEach(clearTimeout); cntT = []; gc.innerHTML = ''; };
  gm.addEventListener('pointerdown', down('m')); gh.addEventListener('pointerdown', down('h'));
  svg.addEventListener('pointerup', up); svg.addEventListener('pointercancel', up); svg.addEventListener('lostpointercapture', up);
  render();
  return api;
}

// ---------- 小鎮（canvas 背景）：天空、太陽／月亮、山、房子、路燈、動物都跟著時刻變
const Town = (() => {
  const cv = $('#town'), g = cv.getContext('2d'); let W = 0, H = 0, DPR = 1, t = 7 * 60, stars = [];
  const lerp = (a, b, k) => a + (b - a) * k;
  const hex = c => [parseInt(c.slice(1, 3), 16), parseInt(c.slice(3, 5), 16), parseInt(c.slice(5, 7), 16)];
  const mix = (a, b, k) => { const A = hex(a), B = hex(b); return `rgb(${Math.round(lerp(A[0], B[0], k))},${Math.round(lerp(A[1], B[1], k))},${Math.round(lerp(A[2], B[2], k))})`; };
  // 天空關鍵影格：[小時, 上色, 下色, 亮度]
  const KF = [[0, '#141c3f', '#2a3566', 0.25], [4.5, '#141c3f', '#2a3566', 0.25], [6, '#6c6aa8', '#ffb98a', 0.6], [7.5, '#8fc9ff', '#ffe9c9', 0.95], [12, '#7ec4ff', '#eaf7ff', 1], [16.5, '#86c3ff', '#ffe3b8', 0.95], [18, '#f29a6a', '#ffd3a0', 0.75], [19.5, '#4a3f7a', '#d2786e', 0.45], [21, '#141c3f', '#2a3566', 0.25], [24, '#141c3f', '#2a3566', 0.25]];
  const sky = h => { let i = 0; while (i < KF.length - 2 && KF[i + 1][0] <= h) i++; const a = KF[i], b = KF[i + 1], k = clamp((h - a[0]) / (b[0] - a[0]), 0, 1); return { top: mix(a[1], b[1], k), bot: mix(a[2], b[2], k), br: lerp(a[3], b[3], k) }; };
  function resize() { DPR = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * DPR; cv.height = H * DPR; cv.style.width = W + 'px'; cv.style.height = H + 'px'; g.setTransform(DPR, 0, 0, DPR, 0, 0); stars = Array.from({ length: 70 }, () => [Math.random() * W, Math.random() * H * 0.55, Math.random() * 1.4 + 0.5]); draw(); }
  const dim = (c, br) => { const [r, gg, b] = typeof c === 'string' && c[0] === '#' ? hex(c) : c.match(/\d+/g).map(Number); return `rgb(${Math.round(r * br)},${Math.round(gg * br)},${Math.round(b * br)})`; };

    const h = t / 60, S = sky(h), br = S.br, night = br < 0.5;
    const gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, S.top); gr.addColorStop(1, S.bot); g.fillStyle = gr; g.fillRect(0, 0, W, H);
    // 星星
    const sa = clamp((0.55 - br) / 0.3, 0, 1); if (sa > 0) { g.fillStyle = `rgba(255,255,255,${0.9 * sa})`; stars.forEach(([x, y, r]) => { g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); }); }
    // 太陽（6:00～18:30 在天上）與月亮（18:30～6:00）
    const arc = (from, to, col, glow, r) => { let k = (h - from) / (to - from); if (h < from) k = (h + 24 - from) / (to - from); if (k < 0 || k > 1) return; const x = lerp(W * 0.1, W * 0.9, k), y = H * 0.42 - Math.sin(k * Math.PI) * H * 0.33; const rg = g.createRadialGradient(x, y, r * 0.6, x, y, r * 3); rg.addColorStop(0, glow); rg.addColorStop(1, 'rgba(255,255,255,0)'); g.fillStyle = rg; g.fillRect(x - r * 3, y - r * 3, r * 6, r * 6); g.fillStyle = col; g.beginPath(); g.arc(x, y, r, 0, 7); g.fill(); return [x, y]; };
    arc(6, 18.5, '#ffd84d', 'rgba(255,220,100,.55)', Math.min(W, H) * 0.06);
    const mp = arc(18.5, 30, '#fff4c8', 'rgba(255,255,220,.35)', Math.min(W, H) * 0.045);   // 月亮：18:30 → 隔天 6:00
    if (!mp && h < 6) arc(-5.5, 6, '#fff4c8', 'rgba(255,255,220,.35)', Math.min(W, H) * 0.045);
    // 遠山
    const gy = H * 0.74;
    g.fillStyle = dim('#8fcf7a', br); g.beginPath(); g.moveTo(0, gy); for (let x = 0; x <= W; x += 8) g.lineTo(x, gy - 40 - Math.sin(x / 90) * 22 - Math.sin(x / 37) * 8); g.lineTo(W, gy); g.fill();
    g.fillStyle = dim('#6fbb63', br); g.beginPath(); g.moveTo(0, gy); for (let x = 0; x <= W; x += 8) g.lineTo(x, gy - 14 - Math.sin(x / 60 + 2) * 14); g.lineTo(W, gy); g.fill();
    // 地面
    g.fillStyle = dim('#79c35e', br); g.fillRect(0, gy, W, H - gy);
    // 房子（6 間，中間留給鐘樓）
    const n = 6, hw = Math.min(64, W / (n + 2)), gap = (W - n * hw) / (n + 1), lit = (h >= 17.5 && h < 22.5) || (h >= 5.5 && h < 7.5);
    const cols = ['#ff8f6b', '#ffd36b', '#7fd3ff', '#c99bff', '#ffa6c9', '#9be7a8'];
    for (let i = 0; i < n; i++) {
      const x = gap + i * (hw + gap), hh = hw * 0.9, y = gy - hh;
      g.fillStyle = dim(cols[i], br); g.fillRect(x, y, hw, hh);
      g.fillStyle = dim('#a35a3a', br); g.beginPath(); g.moveTo(x - 6, y); g.lineTo(x + hw / 2, y - hw * 0.5); g.lineTo(x + hw + 6, y); g.fill();
      const on = lit || (mode === 'day' && litT && i < Math.round(litN / litT * n));   // 小鎮的一天：做完幾件事就亮幾間
      g.fillStyle = on ? '#ffe27a' : night ? dim('#5a6a8a', br) : dim('#bfe6ff', br); g.fillRect(x + hw * 0.18, y + hh * 0.22, hw * 0.25, hw * 0.25); g.fillRect(x + hw * 0.57, y + hh * 0.22, hw * 0.25, hw * 0.25);
      if (on) { g.fillStyle = 'rgba(255,226,122,.25)'; g.fillRect(x + hw * 0.1, y + hh * 0.12, hw * 0.8, hw * 0.45); }
      g.fillStyle = dim('#7a4a2a', br); g.fillRect(x + hw * 0.38, y + hh * 0.58, hw * 0.24, hh * 0.42);
    }
    // 路燈
    for (const x of [W * 0.2, W * 0.8]) { g.fillStyle = dim('#55606e', br); g.fillRect(x - 2, gy - 70, 4, 70); g.fillStyle = night ? '#ffe27a' : dim('#dde', br); g.beginPath(); g.arc(x, gy - 74, 6, 0, 7); g.fill(); if (night) { const rg = g.createRadialGradient(x, gy - 74, 4, x, gy - 74, 60); rg.addColorStop(0, 'rgba(255,226,122,.45)'); rg.addColorStop(1, 'rgba(255,226,122,0)'); g.fillStyle = rg; g.fillRect(x - 60, gy - 134, 120, 140); } }
    // 動物（emoji）：依作息出現在不同地方；睡覺時只剩貓頭鷹
    g.font = `${Math.min(34, W * 0.07)}px system-ui,sans-serif`; g.textAlign = 'center';
    const sc = scene(t), em = { sleep: '🦉', owl: '🦉', wake: '🐻', breakfast: '🐻🥣', school: '🐰🎒', lunch: '🐿️🍙', class: '🐰📖', park: '🐻⚽', dinner: '🐿️🍲', bath: '🐰🛁', story: '🐻📚' }[sc];
    g.fillText(em, W * 0.5, gy + 40);
    if (sc === 'sleep' || sc === 'owl') { g.font = `${Math.min(22, W * 0.05)}px system-ui,sans-serif`; g.fillText('💤', W * 0.3, gy - 70); g.fillText('💤', W * 0.72, gy - 64); }
  }
  // 小鎮的作息（自由玩用）
  let litN = 0, litT = 0;
  function scene(min) { const h = min / 60; return h < 6 ? 'sleep' : h < 7 ? 'wake' : h < 8 ? 'breakfast' : h < 12 ? 'school' : h < 13 ? 'lunch' : h < 15.5 ? 'class' : h < 17.5 ? 'park' : h < 19 ? 'dinner' : h < 20 ? 'bath' : h < 21 ? 'story' : 'owl'; }
  addEventListener('resize', resize);
  return { set(min) { t = min; draw(); }, resize, scene, lit(n, tot) { litN = n; litT = tot; draw(); } };
})();

// ---------- 時刻的說法
function timeWords(tot) {
  const H = Math.floor(tot / 60), m = tot % 60, h12 = H % 12 === 0 ? 12 : H % 12;
  const main = m === 0 ? tx('t.oclock', { h: h12 }) : m === 30 ? tx('t.half', { h: h12 }) : tx('t.hm', { h: h12, m, mm: String(m).padStart(2, '0') });
  const period = H < 5 ? 'p.night' : H < 11 ? 'p.morning' : H < 13 ? 'p.noon' : H < 18 ? 'p.afternoon' : H < 23 ? 'p.evening' : 'p.night';
  return { main, period: tx(period), digital: `${h12}:${String(m).padStart(2, '0')}`, ampm: tx(H < 12 ? 'ampm.am' : 'ampm.pm') };
}

// ---------- 主選單：自由玩的鐘
const clock = Clock($('#clock'), { snap: 5 });
function showTime(tot) {
  const w = timeWords(tot);
  $('#digital').innerHTML = `${w.digital}<small>${w.ampm}</small>`;
  $('#words').textContent = LANG === 'en' ? `${w.main} (${w.period})` : LANG === 'ja' ? `${w.period}${w.main}` : `${w.period} ${w.main}`;
  const sc = Town.scene(tot); $('#scene').innerHTML = `<span class="emo">${{ sleep: '💤', owl: '🦉', wake: '🐻', breakfast: '🥣', school: '🎒', lunch: '🍙', class: '📖', park: '⚽', dinner: '🍲', bath: '🛁', story: '📚' }[sc]}</span>${tx('scene.' + sc)}`;
  Town.set(tot);
}
clock.onChange = (tot, dragging) => { showTime(tot); if (!dragging) { DB.free = tot; save(); } if (dragging && !$('#hintline').hidden) { DB.hinted = true; save(); $('#hintline').hidden = true; } };   // 拖過一次就不用再提示（矮螢幕那一行會蓋到動物）
clock.onSnap = (tot, bell) => { if (bell) SFX.bell(); else SFX.tick(); };

}
$('#go-set').addEventListener('click', () => { renderSet(); $('#o-set').hidden = false; });
$('#set-close').addEventListener('click', () => { $('#o-set').hidden = true; });
$('#set-lang').addEventListener('click', e => { const b = e.target.closest('[data-lang]'); if (!b) return; DB.set.lang = b.dataset.lang; save(); setLang(); renderSet(); showTime(clock.get().tot); SFX.ding(); });
$('#set-level').addEventListener('click', e => { const b = e.target.closest('[data-level]'); if (!b) return; DB.set.level = +b.dataset.level; save(); clock.setSnap(DB.set.level === 3 ? 1 : 5); renderSet(); SFX.ding(); });

// ---------- 模式（還在蓋）
let toastT = 0;
function toast(msg) { const el = $('#toast'); el.textContent = msg; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => { el.hidden = true; }, 2200); }

// ---------- 粒子（慶祝用）
const FX = (() => {
  const cv = $('#fx'), g = cv.getContext('2d'); let P = [], raf = 0, W = 0, H = 0;
  const size = () => { const d = Math.min(2, devicePixelRatio || 1); W = innerWidth; H = innerHeight; cv.width = W * d; cv.height = H * d; g.setTransform(d, 0, 0, d, 0, 0); };

    if (k === 'del') typed = typed.slice(0, -1); else typed += k; render();
    if (typed.length === String(ans).length) { if (+typed === ans) { miss = 0; $('#o-gate').hidden = true; const f = fn; fn = null; f && f(); } else { miss++; typed = ''; if (miss >= 3) { miss = 0; waitUntil = now() + 30000; $('#o-gate').hidden = true; toast(tx('gate.wait')); return; } $('#gate-q').textContent = make(!!$('#gate-q').dataset.hard); render(); SFX.hm(); } }
  });
  $('#gate-cancel').addEventListener('click', () => { $('#o-gate').hidden = true; fn = null; });
  return { open };
})();
$('#set-reset').addEventListener('click', () => Gate.open(() => { const lang = DB.set.lang; DB = fresh(); DB.set.lang = lang; save(); setLang(); renderSet(); clock.setSnap(5); clock.set(7, 0); showTime(clock.get().tot); Quest.ensure(); refreshMenu(); toast(tx('reset.done')); }, true));

// ---------- 每日任務：每天 3 個，做完徽章 +1、連續天數；沒有懲罰、沒有過期提醒
const Quest = (() => {
  const POOL = [{ id: 'day', n: 1, em: '🏘️' }, { id: 'read', n: 8, em: '⏰' }, { id: 'set', n: 5, em: '🐢' }, { id: 'star', n: 2, em: '⭐' }, { id: 'match', n: 1, em: '🃏' }, { id: 'vs', n: 1, em: '🤝' }];
  const today = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const yesterday = () => { const d = new Date(); d.setDate(d.getDate() - 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
  const stars = () => { let n = 0; for (let h = 1; h <= 12; h++) for (let m = 0; m < 60; m += 5) if (StarMap.stateOf(h, m) === 'star') n++; return n; };
  function ensure() {
    const D = DB.daily, t = today(); if (D.date === t && Array.isArray(D.tasks) && D.tasks.length === 3) return;
    const pool = POOL.slice().sort(() => Math.random() - 0.5).slice(0, 3);
    D.date = t; D.tasks = pool.map(q => ({ id: q.id, n: q.n, p: 0, done: false })); D.starBase = stars(); D.badges = num(D.badges); D.streak = num(D.streak); save();
  }
  function text(q) { return tx('q.' + q.id, { n: q.n }); }
  function add(id, v = 1) {
    ensure(); const D = DB.daily, q = D.tasks.find(q => q.id === id && !q.done); if (!q) return;
    q.p = id === 'star' ? Math.max(0, stars() - D.starBase) : q.p + v;
    if (q.p >= q.n) { q.done = true; q.p = q.n; toast(tx('quest.doneOne')); SFX.ding(); if (D.tasks.every(x => x.done)) { D.badges = num(D.badges) + 1; D.streak = D.lastDone === yesterday() ? num(D.streak) + 1 : 1; D.lastDone = today(); setTimeout(() => { toast(tx('quest.doneAll')); FX.confetti(60); }, 1200); } }
    save(); if (mode === 'menu') refreshMenu();
  }
  function render() {
    ensure(); const D = DB.daily;
    $('#quest-list').innerHTML = D.tasks.map(q => `<div class="q${q.done ? ' done' : ''}"><span class="em">${POOL.find(x => x.id === q.id).em}</span><span style="flex:1">${text(q)}<div class="bar"><i style="width:${Math.round(q.p / q.n * 100)}%"></i></div></span><small>${q.done ? '✓' : q.p + '/' + q.n}</small></div>`).join('');
    $('#quest-badges').textContent = tx('quest.badges', { n: num(D.badges) }); $('#quest-streak').textContent = num(D.streak) > 1 && (D.lastDone === today() || D.lastDone === yesterday()) ? tx('quest.streak', { n: D.streak }) : '';
  }
  $('#go-quest').addEventListener('click', () => { render(); $('#o-quest').hidden = false; });
  $('#quest-close').addEventListener('click', () => { $('#o-quest').hidden = true; });
  $('#go-help').addEventListener('click', () => { $('#o-set').hidden = true; $('#o-help').hidden = false; $('#o-help .card').scrollTop = 0; });
  $('#help-close').addEventListener('click', () => { $('#o-help').hidden = true; $('#o-set').hidden = false; });
  $('#go-about').addEventListener('click', () => { $('#o-set').hidden = true; $('#o-about').hidden = false; $('#o-about .card').scrollTop = 0; });
  $('#about-close').addEventListener('click', () => { $('#o-about').hidden = true; $('#o-set').hidden = false; });
  return { ensure, add, render, stars };
})();
function refreshMenu() { Quest.ensure(); const D = DB.daily, done = D.tasks.filter(q => q.done).length, all = done === 3; const c = $('#go-quest'); c.classList.toggle('todo', !all); c.classList.toggle('ok', all); $('#q-count').textContent = all ? '✓' : `${done}/3`; }

// ---------- 配對（翻牌）：指針鐘、數字鐘、文字三種樣子配成對
const Match = (() => {
  const PAIRS = 4, rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1)), shuffle = a => a.sort(() => Math.random() - 0.5);
  let S = null, lock = false;
  function times() {
    const L = DB.set.level, step = L === 1 ? 30 : 5, out = [], has = (h, m) => out.some(t => t[0] === h && t[1] === m);
    const h0 = rnd(1, 12), m0 = Math.floor(Math.random() * (60 / step)) * step; out.push([h0, m0]);
    // 一半的機會放一對容易搞混的（時針快到下一格、兩針對調），孩子才真的要看鐘
    if (Math.random() < 0.5) { if (m0 >= 35) out.push([h0 % 12 + 1, m0]); else if (m0 % 5 === 0 && m0 / 5 >= 1 && h0 * 5 < 60 && L > 1 && !has(m0 / 5, h0 * 5)) out.push([m0 / 5, h0 * 5]); }
    while (out.length < PAIRS) { const h = rnd(1, 12), m = Math.floor(Math.random() * (60 / step)) * step; if (!has(h, m)) out.push([h, m]); }
    return out;
  }
  const reps = (h, m) => { const r = ['a', 'd']; if (LANG !== 'en' || m % 30 === 0) r.push('w'); return shuffle(r).slice(0, 2); };   // 英文的文字跟數字鐘一樣（7:20），只有整點半點才用
  function face(t, rep) {
    const [h, m] = t;
    if (rep === 'd') return `<span class="dg">${h}:${String(m).padStart(2, '0')}</span>`;
    if (rep === 'w') return `<span class="wd">${timeWords(h * 60 + m).main}</span>`;
    const d = document.createElement('div'); const c = Clock(d, { drag: false, snap: 1 }); c.set(h, m); return d.innerHTML;
  }
  function start() {
    const ts = times(), cards = [];
    ts.forEach((t, i) => reps(t[0], t[1]).forEach(r => cards.push({ t, r, i })));
    S = { cards: shuffle(cards), open: [], done: 0, flips: 0 }; lock = false;
    $('#mgrid').innerHTML = S.cards.map((c, i) => `<button type="button" class="mcard" data-i="${i}" aria-label="?"><div class="inner"><div class="f bk">🐾</div><div class="f fr">${face(c.t, c.r)}</div></div></button>`).join('');
    $('#match-hint').hidden = true; $('#o-mdone').hidden = true; prog(); show('match'); Town.set(clock.get().tot);
  }
  function stop() { S = null; }
  function prog() { $('#match-prog').innerHTML = `<span aria-hidden="true">🃏</span>${tx('match.prog', { n: S.done, t: PAIRS })}`; }
  function flip(i) {
    if (!S || lock) return; const c = S.cards[i], el = $(`#mgrid .mcard[data-i="${i}"]`); if (c.done || S.open.includes(i)) return;
    el.classList.add('open'); S.open.push(i); S.flips++; SFX.tick(); $('#match-hint').hidden = true;
    if (S.open.length < 2) return;
    const [a, b] = S.open.map(j => S.cards[j]), ea = $(`#mgrid .mcard[data-i="${S.open[0]}"]`);
    if (a.i === b.i || (a.t[0] === b.t[0] && a.t[1] === b.t[1])) {
      a.done = b.done = true; S.done++; S.open = []; el.classList.add('done'); ea.classList.add('done'); prog(); SFX.ding(); const r = el.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 20);
      const an = a.r === 'a' ? a : b.r === 'a' ? b : null; if (an) record(`r:${an.t[0]}:${an.t[1]}`, true, 0, null, inducible(an.t[0], an.t[1]));
      if (S.done === PAIRS) { const me = S; setTimeout(() => { if (S !== me) return; $('#mdone-p').textContent = tx('match.p', { n: S.flips }); $('#o-mdone').hidden = false; FX.confetti(60); DB.best.matches = num(DB.best.matches) + 1; save(); Quest.add('match'); }, 700); }
      return;
    }
    // 配錯：一張是指針鐘、另一張不是，而且錯法看得出來，才算讀錯（兩張都是數字鐘只是記性）
    lock = true; const an = a.r === 'a' && b.r !== 'a' ? [a, b] : b.r === 'a' && a.r !== 'a' ? [b, a] : null;
    if (an) { const type = classifySet((an[0].t[0] % 12) * 60 + an[0].t[1], (an[1].t[0] % 12) * 60 + an[1].t[1]); if (['hourLate', 'halfHour', 'minIndex', 'handSwap', 'read12', 'minNear'].includes(type)) { record(`r:${an[0].t[0]}:${an[0].t[1]}`, false, 0, type, null); const h1 = an[0].t[0], hb = $('#match-hint'); hb.className = 'bubble'; hb.textContent = tx('hint.' + type, { h1, h2: h1 % 12 + 1 }); hb.hidden = false; } }
    SFX.hm(); const me = S; setTimeout(() => { if (S !== me) return; S.open.forEach(j => $(`#mgrid .mcard[data-i="${j}"]`).classList.remove('open')); el.classList.add('no'); setTimeout(() => el.classList.remove('no'), 500); S.open = []; lock = false; }, 900);
  }
  $('#mgrid').addEventListener('click', e => { const b = e.target.closest('.mcard'); if (b) { ac(); flip(+b.dataset.i); } });
  $('#mdone-again').addEventListener('click', start); $('#mdone-home').addEventListener('click', () => { $('#o-mdone').hidden = true; goHome(); });
  return { start, stop, s: () => S };
})();

// ---------- 兩個人一起：上下分割，各撥各的鐘，先撥對拿一分，5 分贏；可以跟機器人比
const clockA = Clock($('#clockA'), { snap: 5 }), clockB = Clock($('#clockB'), { snap: 5 });
const Versus = (() => {
  const WIN = 5, rnd = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  let S = null, opp = 'cpu', hard = false, raf = 0;
  const task = h => { const L = DB.set.level, step = h ? 1 : L === 1 ? 30 : L === 3 ? 1 : 5; const H = rnd(6, 21), m = Math.floor(Math.random() * (60 / step)) * step; return H * 60 + m; };
  const fmt = t => `${Math.floor(t / 60) % 12 || 12}:${String(t % 60).padStart(2, '0')}`;
  function dots() { ['A', 'B'].forEach(k => { $('#v-dots' + k).innerHTML = Array.from({ length: WIN }, (_, i) => `<i class="${i < S.score[k] ? 'on' : ''}"></i>`).join(''); }); }
  function give(k) {
    const t = task(k === 'B' && opp === 'human' && hard); S.t[k] = t; S.at[k] = now();
    const c = k === 'A' ? clockA : clockB, start = (t + 180 + rnd(0, 300)) % 1440; c.set(Math.floor(start / 60), start % 60); $(k === 'A' ? '#v-t1' : '#v-t2').textContent = fmt(t);
    if (k === 'B' && opp === 'cpu') cpuGo();
  }
  function point(k) {
    S.score[k]++; dots(); SFX.ding(); const half = $(k === 'A' ? '#v-bottom' : '#v-top'); const r = half.getBoundingClientRect(); FX.burst(r.left + r.width / 2, r.top + r.height / 2, 24);
    if (k === 'A') { const t = S.t.A; record(`s:${Math.floor(t / 60)}:${t % 60}`, true, now() - S.at.A, null, inducible(Math.floor(t / 60) % 12 || 12, t % 60)); S.times.push(now() - S.at.A); Quest.add('set'); Quest.add('star'); }
    if (S.score[k] >= WIN) { finish(k); return; } give(k);
  }
  // 機器人：想的時間跟著孩子的速度（最近幾次撥對的時間 ×1.1），落後就快一點、領先就慢一點
  function cpuGo() {
    cancelAnimationFrame(raf); const avg = S.times.length ? S.times.slice(-4).reduce((a, b) => a + b, 0) / Math.min(4, S.times.length) : 6000;
    let d = clamp(avg * 1.1, 3000, 12000) * (S.score.A - S.score.B >= 2 ? 0.8 : S.score.B - S.score.A >= 2 ? 1.3 : 1) * (0.8 + Math.random() * 0.45);
    let t0 = now(); const from = clockB.get().tot, to = S.t.B, fw = ((to - from) % 1440 + 1440) % 1440, me = S; S.shift = d => { t0 += d; };
    $('#v-robot').classList.add('think');
    const step = () => { if (S !== me) return; const k = Math.min(1, (now() - t0) / d); $('#v-bar i').style.width = Math.round(k * 100) + '%'; const cur = (from + fw * (k < 0.3 ? 0 : (k - 0.3) / 0.7)) % 1440; clockB.set(Math.floor(cur / 60), cur % 60); if (k < 1) raf = requestAnimationFrame(step); else { $('#v-robot').classList.remove('think'); clockB.set(Math.floor(to / 60), to % 60); point('B'); } };
    raf = requestAnimationFrame(step);
  }
  function start() {
    S = { score: { A: 0, B: 0 }, t: {}, at: {}, times: [] }; $('#o-vs').hidden = true; $('#o-vdone').hidden = true; show('versus');
    const cpu = opp === 'cpu'; $('#v-top').classList.toggle('flip', !cpu); $('#v-robot').hidden = !cpu; $('#v-bar').hidden = !cpu; clockB.drag = !cpu; $('#clockB').hidden = false;
    $('#v-emoB').textContent = cpu ? '🤖' : '🐰'; $('#v-emo2').textContent = cpu ? '🤖' : '🐰'; clockA.setSnap(DB.set.level === 3 ? 1 : 5); clockB.setSnap(!cpu && hard ? 1 : DB.set.level === 3 ? 1 : 5); dots(); give('A'); give('B');
  }
  function stop() { cancelAnimationFrame(raf); S = null; }
  let hidAt = 0; document.addEventListener('visibilitychange', () => { if (document.hidden) hidAt = now(); else if (S && S.shift && hidAt) { S.shift(now() - hidAt); S.at.A += now() - hidAt; } hidAt = 0; });   // 切到背景的時間不算機器人在想、也不算孩子在撥
  function finish(k) { cancelAnimationFrame(raf); const cpu = opp === 'cpu'; const win = k === 'A' || !cpu; $('#vdone-emo').textContent = win ? '🏆' : '🤖'; $('#vdone-h').textContent = k === 'A' ? tx('vs.win', { who: tx('vs.p1') }) : cpu ? tx('vs.cpuWin') : tx('vs.win', { who: tx('vs.p2') }); if (win) FX.confetti(60); $('#o-vdone').hidden = false; const me = S; S = null; DB.best.vs = num(DB.best.vs) + 1; save(); Quest.add('vs'); }
  clockA.onChange = (tot, dragging) => { if (!S || dragging) return; if (tot % 720 === S.t.A % 720) point('A'); };
  clockB.onChange = (tot, dragging) => { if (!S || dragging || opp === 'cpu') return; if (tot % 720 === S.t.B % 720) point('B'); };
  clockA.onSnap = clockB.onSnap = () => SFX.tick();
  function open() { $('#o-vs').hidden = false; $('#vs-hardrow').hidden = opp === 'cpu'; }
  $('#vs-opp').addEventListener('click', e => { const b = e.target.closest('[data-opp]'); if (!b) return; opp = b.dataset.opp; $$('#vs-opp button').forEach(x => x.setAttribute('aria-pressed', String(x === b))); $('#vs-hardrow').hidden = opp === 'cpu'; });
  $('#vs-hard').addEventListener('click', () => { hard = !hard; $('#vs-hard').setAttribute('aria-pressed', String(hard)); $('#vs-hard').textContent = tx(hard ? 'on' : 'off'); });
  $('#vs-start').addEventListener('click', () => { ac(); start(); }); $('#vs-cancel').addEventListener('click', () => { $('#o-vs').hidden = true; });
  $('#vdone-again').addEventListener('click', () => { ac(); start(); }); $('#vdone-home').addEventListener('click', () => { $('#o-vdone').hidden = true; goHome(); });
  $('#s-versus').addEventListener('gesturestart', e => e.preventDefault());
  return { open, start, stop, s: () => S, setOpp: o => { opp = o; } };
})();

// ---------- 鐘面星圖：12 片（每片 5 分）× 12 圈（裡面 1 點、外面 12 點）
const StarMap = (() => {
  const svgNS = 'http://www.w3.org/2000/svg', C = 100, R0 = 26, R1 = 92;
  let sel = -1;
  function stateOf(h, m) {   // 讀鐘 r:h:m 與撥鐘 s:H:m（H 是 24 小時，兩個都看）合起來
    const fs = [DB.facts[`r:${h}:${m}`], DB.facts[`s:${h % 12}:${m}`], DB.facts[`s:${h % 12 + 12}:${m}`]].filter(Boolean);
    if (!fs.length) return 'new';
    const err = Math.max(...fs.map(f => f.err)), n = fs.reduce((a, f) => a + f.n, 0), w = fs.reduce((a, f) => a + f.w, 0);
    if (err >= 0.45 || (err >= 0.25 && w >= 2)) return 'weak';
    if (n >= 3 && err < 0.15) return 'star';
    return 'learn';
  }
  const inLevel = m => DB.set.level === 1 ? m % 30 === 0 : true;
  function render() {
    const el = $('#map'); el.innerHTML = ''; const svg = document.createElementNS(svgNS, 'svg'); svg.setAttribute('viewBox', '0 0 200 200');
    const mk = (n, a) => { const e = document.createElementNS(svgNS, n); for (const k in a) e.setAttribute(k, a[k]); return e; };
    const pt = (r, deg) => [C + r * Math.sin(deg * Math.PI / 180), C - r * Math.cos(deg * Math.PI / 180)];
    let lit = 0, tot = 0;
    for (let k = 0; k < 12; k++) for (let i = 0; i < 12; i++) {
      const h = i + 1, m = k * 5, r0 = R0 + (R1 - R0) * i / 12, r1 = R0 + (R1 - R0) * (i + 1) / 12 - 0.4, a0 = k * 30 - 15 + 0.8, a1 = k * 30 + 15 - 0.8;
      const [x0, y0] = pt(r0, a0), [x1, y1] = pt(r1, a0), [x2, y2] = pt(r1, a1), [x3, y3] = pt(r0, a1);
      const st = stateOf(h, m), on = inLevel(m); if (on) { tot++; if (st === 'star') lit++; }
      const pth = mk('path', { d: `M${x0} ${y0}L${x1} ${y1}A${r1} ${r1} 0 0 1 ${x2} ${y2}L${x3} ${y3}A${r0} ${r0} 0 0 0 ${x0} ${y0}Z`, class: `cell ${st}${on ? '' : ' dim'}${sel === k ? ' on' : ''}`, 'data-k': k });
      svg.appendChild(pth);
    }
    for (let k = 0; k < 12; k++) { const [x, y] = pt(R1 + 7, k * 30); const t = mk('text', { x, y: y + 3, class: 'mlab' }); t.textContent = String(k * 5).padStart(2, '0'); svg.appendChild(t); }
    const cc = mk('circle', { cx: C, cy: C, r: R0 - 3, fill: 'rgba(255,255,255,.75)' }); svg.appendChild(cc);
    const t12 = mk('text', { x: C, y: C + 4, class: 'mlab', style: 'fill:#3b2f2f;stroke:none;font-size:11px' }); t12.textContent = '1→12'; svg.appendChild(t12);
    svg.classList.toggle('sec-on', sel >= 0); el.appendChild(svg);
    $('#map-count').innerHTML = `<span aria-hidden="true">⭐</span>${tx('map.count', { n: lit, t: tot })}`; $('#map-count').setAttribute('aria-label', tx('map.aria', { n: lit, t: tot }));
    info();
  }
  function info() {
    const el = $('#map-info');
    if (sel >= 0) { const m = sel * 5; el.innerHTML = tx('map.sector', { m: String(m).padStart(2, '0') }) + `<div class="hrow">${Array.from({ length: 12 }, (_, i) => `<span class="${stateOf(i + 1, m)}">${i + 1}</span>`).join('')}</div>`; return; }
    const top = Object.entries(DB.errs).filter(([k, v]) => ERRS.includes(k) && v >= 0.2).sort((a, b) => b[1] - a[1])[0];
    el.innerHTML = tx('map.info') + (top ? '<br>' + tx('map.weak', { e: tx('err.' + top[0]) }) : '');
  }
  $('#map').addEventListener('click', e => { const c = e.target.closest('.cell'); if (!c) return; const k = +c.dataset.k; sel = sel === k ? -1 : k; render(); SFX.tick(); });
  function open() { sel = -1; show('map'); Town.set(clock.get().tot); render(); }
  return { open, stateOf, render };
})();
$('#go-map').addEventListener('click', () => { ac(); StarMap.open(); });

// ---------- 開始
loadDB(); setLang(); Town.resize();
if (DB.hinted) $('#hintline').hidden = true; refreshMenu();
clock.setSnap(DB.set.level === 3 ? 1 : 5); clock.set(Math.floor(DB.free / 60), DB.free % 60); showTime(clock.get().tot);
document.fonts && document.fonts.ready.then(() => Town.resize());
window.__tt = { clock, clock2, clock3, DB: () => DB, Town, timeWords, Day, Read, Match, Versus, clockA, clockB, Map: StarMap, Quest, Gate, classifySet };   // 給測試用
})();
